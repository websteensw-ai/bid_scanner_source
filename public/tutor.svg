<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="튜터">
  <!-- 튜터 캐릭터 '소크 선생님' (엘렝코스 자체 제작). 눈 깜빡임·고개 끄덕임 애니메이션 -->
  <style>
    .bob{animation:bob 4.8s ease-in-out infinite;transform-origin:60px 100px}
    .lid{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
    .lid2{animation-delay:.03s}
    .twinkle{animation:tw 2.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-2.5deg) translateY(-1.2px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.bob,.lid,.twinkle{animation:none}}
  </style>
  <defs><clipPath id="c"><circle cx="60" cy="60" r="58"/></clipPath></defs>
  <circle cx="60" cy="60" r="58" fill="#E9F0FF"/>
  <g clip-path="url(#c)"><g class="bob">
    <!-- 토가 -->
    <path d="M20 122c2-22 18-34 40-34s38 12 40 34z" fill="#FFF3D6"/>
    <path d="M44 90c10 9 22 20 30 28h-14c-6-9-13-17-20-24z" fill="#5B7CFA"/>
    <!-- 귀 -->
    <ellipse cx="31" cy="58" rx="6" ry="8" fill="#F2C3A1"/>
    <ellipse cx="89" cy="58" rx="6" ry="8" fill="#F2C3A1"/>
    <!-- 얼굴 -->
    <ellipse cx="60" cy="54" rx="29" ry="31" fill="#FAD6B8"/>
    <!-- 이마 반짝 -->
    <ellipse cx="51" cy="31" rx="9" ry="4" fill="#FFFFFF" opacity=".55"/>
    <!-- 옆머리 -->
    <g fill="#FFFFFF" stroke="#DDE3EF" stroke-width="1">
      <circle cx="31" cy="45" r="6"/><circle cx="28" cy="52" r="5"/><circle cx="33" cy="39" r="4.5"/>
      <circle cx="89" cy="45" r="6"/><circle cx="92" cy="52" r="5"/><circle cx="87" cy="39" r="4.5"/>
    </g>
    <!-- 수염 -->
    <path d="M33 62c0 22 12 36 27 36s27-14 27-36c-5 6-12 8-17 6-3 4-7 5-10 5s-7-1-10-5c-5 2-12 0-17-6z" fill="#FFFFFF" stroke="#DDE3EF" stroke-width="1.2"/>
    <path d="M42 80c4 4 6 9 5 13M78 80c-4 4-6 9-5 13M60 84v10" stroke="#E3E8F3" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 콧수염 -->
    <path d="M45 66c5-4 10-4 15 0 5-4 10-4 15 0-4 5-10 5-15 2-5 3-11 3-15-2z" fill="#FFFFFF" stroke="#E3E8F3" stroke-width="1"/>
    <!-- 웃는 입 -->
    <path d="M54 72c3 3 9 3 12 0" stroke="#C0665A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 코 -->
    <ellipse cx="60" cy="60" rx="5" ry="4" fill="#F0B490"/>
    <!-- 볼 -->
    <ellipse cx="41" cy="61" rx="5" ry="3" fill="#FF9E9E" opacity=".55"/>
    <ellipse cx="79" cy="61" rx="5" ry="3" fill="#FF9E9E" opacity=".55"/>
    <!-- 눈썹 -->
    <path d="M40 41c4-4 10-4 13-1M67 40c3-3 9-3 13 1" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M40 41c4-4 10-4 13-1M67 40c3-3 9-3 13 1" stroke="#D9DEE9" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 눈 -->
    <ellipse cx="47" cy="50" rx="5" ry="6" fill="#2A2F45"/>
    <ellipse cx="73" cy="50" rx="5" ry="6" fill="#2A2F45"/>
    <circle cx="48.8" cy="47.6" r="1.8" fill="#FFFFFF"/>
    <circle cx="74.8" cy="47.6" r="1.8" fill="#FFFFFF"/>
    <!-- 눈꺼풀 (깜빡임) -->
    <rect class="lid" x="41" y="43" width="12" height="13" rx="6" fill="#FAD6B8"/>
    <rect class="lid lid2" x="67" y="43" width="12" height="13" rx="6" fill="#FAD6B8"/>
  </g></g>
  <!-- 반짝 (생각 중) -->
  <path class="twinkle" d="M101 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#FFC94D"/>
</svg>
