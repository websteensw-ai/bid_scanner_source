    expect: {pass: false, error: e_belief_proof}
    tags: [misreading]
    ref: S2-027

  # ---------------- L3 ----------------
  - id: l3-compare-pass
    bundle: L3
    step: l3_compare
    answer: 질문 — 사람들의 자유와 판단은 어떤 조건에서 지켜질 수 있는가? (가)는 올바르게 제정된 법을 따를 때 자유가 지켜진다고 강조하고, (나)는 다수의 판단도 법이 정한 절차를 거쳐야 한다고 강조한다.
    evidence: (가) 둘째 문단, (나) 둘째 문단
    expect: {pass: true}
    tags: [basic]
    ref: L3-009
  - id: l3-compare-topic
    bundle: L3
    step: l3_compare
    answer: 둘 다 법 이야기다.
    expect: {pass: false, error: e3_topic}
    tags: [topic_only]
    ref: L3-011
  - id: l3-compare-opposed
    bundle: L3
    step: l3_compare
    answer: (가)는 법을 지키라고 하고 (나)는 법에 반대하므로 두 글은 정반대다.
    expect: {pass: false, error: e3_opposed}
    tags: [misreading]
    ref: L3-014
  - id: l3-cond-pass
    bundle: L3
    step: l3_condition
    choice: 조건부로 타당함
    answer: 원문은 올바르게 제정된 법이라는 조건을 붙였는데 해석 문장에서 그 조건이 빠졌다.
    expect: {pass: true}
    tags: [basic]
    ref: L3-016
  - id: l3-cond-alt-choice
    bundle: L3
    step: l3_condition
    choice: 뒷받침되지 않음
    answer: (가)는 아무 법이나가 아니라 올바르게 제정된 법을 따르라고 했으므로, 해석 문장은 원문보다 넓다.
    expect: {pass: true}
    tags: [valid_alternative]
    ref: L3-018, P-010
  - id: l3-cond-accept
    bundle: L3
    step: l3_condition
    choice: 타당함
    answer: (가)에서 법을 따르면 자유를 지킨다고 했으니 맞다.
    expect: {pass: false, error: e3_cond_accept}
    tags: [scope]
    ref: L3-016
  - id: l3-cause-pass
    bundle: L3
    step: l3_cause
    choice: 뒷받침되지 않음
    answer: (라)는 검소함과 청렴을 함께 서술했을 뿐, 검소함이 원인이라고 확인해 주지는 않는다.
    expect: {pass: true}
    tags: [basic]
    ref: L3-050, S3-015
  - id: l3-cause-accept
    bundle: L3
    step: l3_cause
    choice: 타당함
    answer: 검소하게 살았으니까 청렴했던 것이다.
    expect: {pass: false, error: e3_cause}
    tags: [misreading]
    ref: L3-052
  - id: l3-analogy-alt
    bundle: L3
    step: l3_analogy
    choice: 타당함
    answer: 학생회도 여러 사람의 돈을 함께 다룬다는 점이 비슷해서 쓰임을 공개하면 신뢰에 도움이 될 수 있다. 다만 규모와 상황은 다르다.
    expect: {pass: true}
    tags: [valid_alternative]
    ref: L3-051

  # ---------------- L4 ----------------
  - id: l4-claim-pass
    bundle: L4
    step: l4_claim
    answer: 공적 권한을 가진 사람은 권한을 쓸 때 가족이 아니라 공정한 기준을 따라야 한다. 가족에게 자리를 주면 다른 사람의 기회가 줄어들기 때문이다.
    evidence: 둘째 문단
    expect: {pass: true}
    tags: [basic]
    ref: L4-010
  - id: l4-claim-alt-stance
    bundle: L4
    step: l4_claim
    answer: 가족을 아끼는 마음을 없앨 필요는 없고, 대신 가족이 관련된 결정에서는 스스로 빠지는 원칙이 필요하다. 그래야 다른 사람의 기회가 지켜진다.
    evidence: 둘째·넷째 문단
    expect: {pass: true}
    tags: [valid_alternative]
    ref: L4-004, L4-019
  - id: l4-claim-summary
    bundle: L4
    step: l4_claim
    answer: 제시문은 가족애가 자연스럽지만 공적 권한에 옮기면 문제가 생긴다고 한다.
    expect: {pass: false, error: e4_summary}
    tags: [topic_only]
    ref: L4-051
  - id: l4-claim-unverified
    bundle: L4
    step: l4_claim
    answer: 가족을 채용하면 통계적으로 반드시 성과가 떨어지므로 공직자는 가족 채용을 금지해야 한다.
    expect: {pass: false, error: e4_fact}
    tags: [unverified_fact]
    ref: L4-043
  - id: l4-counter-pass
    bundle: L4
    step: l4_counter
    answer: 하지만 가족이 실제로 가장 능력 있는 경우에도 무조건 배제하면, 오히려 공정한 기준에 맞지 않는 문제가 생길 수 있다.
    expect: {pass: true}
    tags: [basic]
    ref: L4-030
  - id: l4-counter-no-reason
    bundle: L4
    step: l4_counter
    answer: 나는 반대한다.
    expect: {pass: false, error: e4_no_reason}
    tags: [too_short]
    ref: L4-031, L4-017

  # ---------------- L5 ----------------
  - id: l5-final-pass
    bundle: L5
    step: l5_final
    answer: 공적 권한을 가진 사람은 가족을 아끼는 마음보다 공동체에 대한 책임을 앞세워야 한다. 가족에게 자리를 주면 그 기회를 공정하게 얻었어야 할 다른 사람의 몫이 줄어들기 때문이다. 물론 가족이 가장 능력 있는 경우도 있다. 그렇더라도 공개된 같은 기준으로 심사받을 때만 허용해야 가족애가 판단의 기준이 되지 않는다.
    expect: {pass: true}
    tags: [basic]
    ref: L5-018~L5-023
  - id: l5-final-offtopic
    bundle: L5
    step: l5_final
    answer: 가족을 아끼는 마음은 가장 자연스러운 감정이다. 부모가 자식을 챙기는 것은 당연하다. 그래서 가족은 소중하다.
    expect: {pass: false, error: e5_offtopic}
    tags: [misreading]
    ref: L5-018, L5-059

