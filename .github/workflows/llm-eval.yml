name: LLM 품질 평가

on:
  pull_request:
    paths: ["content/**", "src/learning/**", "evals/**", "tests/**"]
  workflow_dispatch:
    inputs:
      limit:
        description: "평가할 사례 수 (비우면 전체)"
        required: false
        default: ""
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 03:17 (KST)

jobs:
  # 키 없이 항상 실행: 테스트 + 데모 분석기 회귀 기준선
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m evals.run_eval --analyzer demo

  # 실제 AI 분석기 + Ragas judge (수동·주간 실행, 저장소 Secret 필요)
  llm-ragas:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'claude' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-eval.txt
      - name: 키 확인
        run: |
          if [ -z "$ANTHROPIC_API_KEY$OPENAI_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY / OPENAI_API_KEY Secret 이 없어 LLM 평가를 건너뜁니다."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: 골든셋 + Ragas 평가
        if: env.SKIP != '1'
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          python -m evals.run_eval --analyzer llm --ragas ${LIMIT:+--limit $LIMIT} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: llm-quality-report
          path: evals/reports/
