# 단계 카드 (문제와 무관한 부분) — 가이드 6-3
# 엔진에 내장되는 데이터. 문제별 구체 기준은 문제 패키지의 stage_overrides 에 둔다.
# ※ 단계 문건 02~09 를 받기 전의 임시판. 중심 질문·하위 목표 문구는 설계자 검수 후 교체한다.
version: 0.1.0
status: draft
style: "세요"          # 18장 결정 2 (권장안). 설계자 확정 전 임시
limits:
  turns_per_subgoal: 8    # 초과 시 보충 사다리 한 칸 상승 (18장 결정 5)
  turns_per_stage: 40     # 초과 시 flagged + 교사 알림
  max_utterance_chars: 250
  paste_alert_chars: 30

# 보충 사다리 0~5 와 지원 수준 대응 (5-5). 한 턴에 한 칸만 오른다.
ladder:
  - {rung: 0, name: "열린 질문", support: independent}
  - {rung: 1, name: "학생 말 되묻기", support: question_then_revised}
  - {rung: 2, name: "원문 대목 가리키기", support: question_then_revised}
  - {rung: 3, name: "대조·선택 발판", support: scaffolded}
  - {rung: 4, name: "개념 설명 후 재서술", support: explained_then_restated}
  - {rung: 5, name: "부분 예시 후 자기 문장으로", support: explained_then_restated}

forbidden:          # 모든 단계 공통 금지 (헌장과 함께 튜터에게 전달)
  - 모범답안이나 기준 해석 문장을 먼저 말하지 않는다
  - 한 발화에 질문은 하나만 한다
  - 학생 대신 완성 문장을 써 주지 않는다
  - 학생이 이미 충족한 하위 목표를 다시 묻지 않는다

stages:
  - id: "0"
    name: 출제 문제 제시와 풀이 준비
    kind: dialogue
    # 설계자 전달본 2026-11-14 (docs/design/stage0_2026-11-14.md) 로 이전 0단계 설계를 대체
    central_question: 나는 지금 어떤 문제를 풀어야 하며, 그것을 풀기 위해 제시문에서 무엇을 확인해야 할까요?
    scope: >-
      무엇을 해야 하며 어떻게 읽을지 준비한다. 지시어·대상·조건을 잠정적으로 구분하고 찾아야 할 내용과 근거의 종류를 정한다.
      두 관점의 정확한 차이나 완성된 설명은 요구하지 않는다 (1단계 이후).
    first_check: 논제를 읽고, 이번 답안에서 해야 할 일을 자신의 말로 설명해 보세요. 제시문을 읽으면서 무엇을 확인해야 할지도 덧붙여 보세요.
    opener: |-
      지금부터 실제 출제 문제를 풀어요. 먼저 논제를 읽고, 무엇을 해야 하는지 확인해 봐요.
      익숙한 인물이나 주제가 나오더라도 알고 있는 내용을 곧바로 쓰지는 마세요. 문제에서 무엇을 설명하고, 비교하고, 판단하라고 하는지 먼저 살펴보세요.
      제시문을 읽을 때는 중요한 단어에 표시하는 데서 멈추지 말고, 무엇과 무엇을 어떤 관계로 설명하는지 확인해요. 나중에 내 설명을 뒷받침할 대목도 찾아야 해요.
      지금은 정답이나 완성된 논술문을 요구하지 않아요. 무엇을 해야 할지와 아직 확인해야 할 부분을 말하면 돼요.
    judge_mode: required_all      # 핵심 완료 기준(required) 을 모두 정리에 담아야 통과
    verdicts: true                # 준비 확인 / 지원 후 준비 확인 / 추가 지원 필요 / 미확인
    subgoals:
      - {id: S0-1, goal: "요구한 활동 파악 — 설명·비교 등 해야 할 일을 말한다", question: "논제에서 행동을 요구하는 표현을 찾아볼까요?", required: true}
      - {id: S0-2, goal: "대상과 관점 구별 — 무엇을 어떤 관점으로 설명할지 구별한다", question: "이 문장에서 설명받는 대상은 무엇일까요?", required: true}
      - {id: S0-3, goal: "요구의 완결성 — 일부 과업만 하고 끝내지 않는다", question: "‘두 설명’은 앞의 어떤 활동을 가리킬까요?", required: true}
      - {id: S0-4, goal: "근거 중심 읽기 — 원문에서 관점과 사례의 연결 근거를 찾겠다고 말한다", question: "그 설명이 맞는지 무엇으로 확인할 건가요?", required: true}
      - {id: S0-5, goal: "조건 확인 — 700자 이내 등 작성 조건을 확인한다", question: "작성 조건에서 지켜야 할 사항을 찾아볼까요?", required: true}
      - {id: S0-6, goal: "불확실성 인식 — 모르는 내용과 확인할 부분을 구별한다", question: "지금 확정하지 않고 더 읽어야 할 부분은 무엇일까요?", required: false}
    outputs:
      - {key: memo, label: "풀이 준비 메모 — 무엇을 해야 하고, 무엇을 찾아 읽을지 내 말로", min_chars: 40, prefill: evidence_turns}
      - {key: unsure, label: 아직 확인하지 못한 부분 (1단계에서 확인할 것), min_chars: 5, prefill: "subgoal:S0-6"}
    tips:
      - {title: 주제어보다 지시어를 먼저, text: "‘무슨 이야기인가?’와 함께 ‘그 이야기를 가지고 무엇을 하라는가?’를 확인해요. ‘비교’라는 낱말을 찾았다고 비교 대상과 기준까지 안 것은 아니에요."}
      - {title: 대상과 관점을 구별, text: "설명할 대상과, 설명할 때 쓰는 관점은 달라요. 논제 문장의 짜임을 근거로 나눠 봐요."}
      - {title: 여러 요구를 빠짐없이, text: "‘각각’, ‘그리고’, ‘이를 바탕으로’, ‘두 설명’ 같은 표현을 보고 한 가지 일만 하고 끝내도 되는지 확인해요."}
      - {title: 낱말이 아니라 관계를 읽기, text: "무엇을 주장하는지, 어떤 이유로 설명하는지, 사례는 무엇을 보여 주려는지, 어떤 조건이 붙어 있는지 구별하며 읽어요."}
      - {title: 아는 지식과 제시문 근거를 구분, text: "익숙한 인물에 관한 지식이 제시문의 설명을 대신하면 안 돼요. 먼저 제시문에 나온 내용과 논제가 정한 관점을 확인해요."}
      - {title: 모르는 것은 표시하고 서두르지 않기, text: "모르는 말은 표시하고 문맥으로 짐작하되, 핵심에 영향을 주면 다시 확인해요. ‘이 부분은 더 읽어 봐야 한다’고 판단하는 것도 실력이에요."}
    self_questions:          # 실전 준비 질문 (Ⅹ) — 처음에는 화면에 보여 주고 점차 줄인다
      - 무엇을 해야 하는가?
      - 무엇을 대상으로, 어떤 자료를 사용해야 하는가?
      - 제시문에서 무엇과 그 근거를 찾아야 하는가?
      - 빠뜨리면 안 되는 요구와 조건은 무엇인가?
    stage_forbidden:
      - 이번 문제의 두 관점이나 초점 차이를 대신 설명하지 않는다
      - 대상·관점 역할표를 먼저 배정해 주지 않는다 (학생이 논제 문장을 근거로 구분)
      - 특정 제시문을 읽지 말라고 먼저 지시하지 않는다 (학생이 지정된 자료를 스스로 구별)
      - 이해했느냐고 묻고 ‘네’로 확인하지 않는다
    done_message: 무엇을 해야 하는지와 무엇을 찾아 읽을지가 정리됐어요. 이제 1단계에서 실제 원문을 읽고, 방금 세운 이해가 맞는지 확인해 봐요.

  - id: "1"
    name: 제시문 읽기
    kind: dialogue
    central_question: (가)와 (나)는 각각 무엇을 말하고 있나요?
    opener_from: "0"     # 0단계 준비 메모를 불러와 시작 (무엇을 해야 하는지를 다시 묻지 않음)
    opener: 앞서 준비 메모에 정리한 대로, 이제 실제로 읽어 봐요. 먼저 (가)가 무엇을 설명하는 글인지, 그렇게 판단한 근거가 된 대목과 함께 말해 보세요.
    scope: 두 제시문의 중심 내용을 원문 범위 안에서 말한다. (다)에 대한 적용은 3단계로 넘긴다.
    subgoals:
      - {id: S1-1, goal: (가)의 중심 내용을 원문 근거와 함께 말한다}
      - {id: S1-2, goal: (나)의 중심 내용을 원문 근거와 함께 말한다}
      - {id: S1-3, goal: 원문이 말한 범위를 넘지 않게 표현을 다듬는다}
    outputs:
      - {key: summary_ga, label: (가)의 중심 내용, min_chars: 15}
      - {key: summary_na, label: (나)의 중심 내용, min_chars: 15}
      - {key: refs, label: 근거 문단 (예 가-2, 나-1), min_chars: 3}

  - id: "2"
    name: 설명 기준 세우기
    kind: dialogue
    central_question: 두 관점은 사람을 무엇으로 판단하나요?
    scope: 각 관점이 인물을 설명할 때 쓰는 기준과 두 기준을 비교할 공통 축을 세운다.
    subgoals:
      - {id: S2-1, goal: (가) 관점의 판단 기준을 말한다}
      - {id: S2-2, goal: (나) 관점의 판단 기준을 말한다}
      - {id: S2-3, goal: 두 기준을 비교할 공통 축을 정한다}
    outputs:
      - {key: criterion_ga, label: (가)의 설명 기준, min_chars: 10}
      - {key: criterion_na, label: (나)의 설명 기준, min_chars: 10}
      - {key: axis, label: 비교의 공통 기준, min_chars: 8}

  - id: "3"
    name: (가)로 (다) 설명하기
    kind: dialogue
    central_question: (가)의 관점에서 (다)의 인물은 어떻게 설명되나요?
    scope: (다)에서 관련 사실을 찾고 (가)의 기준으로 설명한다. 설명의 범위를 지킨다.
    subgoals:
      - {id: S3-1, goal: (다)에서 (가)의 기준과 관련된 사실을 찾는다}
      - {id: S3-2, goal: 그 사실을 (가)의 기준으로 설명한다}
      - {id: S3-3, goal: 설명이 원문이 허락하는 범위를 넘지 않는지 점검한다}
    outputs:
      - {key: facts, label: (다)에서 찾은 사실 (문단 번호), min_chars: 10}
      - {key: explanation, label: (가) 관점의 설명, min_chars: 20}
      - {key: limit, label: 설명의 범위 점검, min_chars: 8}

  - id: "4"
    name: (나)로 설명하고 비교하기
    kind: dialogue
    central_question: (나)의 관점에서는 어떻게 설명되고, 두 설명은 무엇이 다른가요?
    scope: (나)의 기준으로 설명한 뒤, 2단계의 공통 기준으로 두 설명의 초점을 비교한다.
    subgoals:
      - {id: S4-1, goal: (다)의 사실을 (나)의 기준으로 설명한다}
      - {id: S4-2, goal: 공통 기준으로 두 설명의 초점을 비교한다}
      - {id: S4-3, goal: 한쪽을 부정하거나 양자택일로 만들지 않는다}
    outputs:
      - {key: explanation, label: (나) 관점의 설명, min_chars: 20}
      - {key: comparison, label: 두 설명의 초점 비교, min_chars: 20}

  - id: "5"
    name: 작성용 개요
    kind: dialogue
    central_question: 세 요구를 어떤 순서와 근거로 배치할까요?
    scope: 앞 단계 산출물로 세 문단 개요를 만든다. 비필수 내용은 뺀다.
    subgoals:
      - {id: S5-1, goal: 세 요구를 문단에 배치한다}
      - {id: S5-2, goal: 문단마다 쓸 근거 문단을 정한다}
      - {id: S5-3, goal: 논제가 요구하지 않는 내용을 뺀다}
    outputs:
      - {key: p1, label: 1문단 개요, min_chars: 10}
      - {key: p2, label: 2문단 개요, min_chars: 10}
      - {key: p3, label: 3문단 개요, min_chars: 10}

  - id: "6"
    name: 독립 작성
    kind: writing
    central_question: 이제 혼자 써 볼까요?
    scope: 튜터의 내용 지원 없이 원고지에 쓰고 스스로 점검한다.
    selfcheck:            # 문건 08 Ⅵ 의 다섯 항목 (임시 문구)
      - {key: tasks, label: "세 요구를 모두 수행했나요?"}
      - {key: evidence, label: "원문 근거와 연결 추론이 있나요?"}
      - {key: scope, label: "설명이 원문의 범위를 넘지 않나요?"}
      - {key: form, label: "구성과 표현이 분명한가요?"}
      - {key: length, label: "분량과 제출 조건을 지켰나요?"}

  # ---- 제6단계 이후 평가·첨삭·복습 구간 (가이드 개정판 2026-11-20)
  - id: "6.1"
    name: 평가기준 적용
    kind: review
    central_question: 제출본의 어느 구절이 기준을 충족할까요?
    scope: 고정 제출본에 채점표(09-1) 동일 버전을 적용한다. 항목별 수준·근거·점수, 평가 보류와 0점 구분. 평가와 근거를 6-2에 인계한다.

  - id: "6.2"
    name: 첨삭·재평가
    kind: review
    central_question: 내 글의 어디를 고치고 어디를 유지할까요?
    scope: >-
      원고 구절에 연결된 문답 → 학생 수정본 → 같은 채점표로 재평가. 핵심 요구 누락·오독·비약·새 오류·분량 위반이 남으면
      관련 구절에 추가 첨삭을 열고 다시 쓴다. 학생이 확정한 버전에만 최종본 상태를 준다.
    thread_steps: [뜻 확인, 제시문 근거, 논제에서의 기능, 수정·유지 판단, 결과 검증]
    max_rounds: 3

  - id: "6.3"
    name: 종합평가·복습
    kind: review
    central_question: 무엇이 달라졌고, 다음에는 무엇을 점검할까요?
    scope: 튜터가 대표 성취·수정과 유지의 이유·실제 지원 수준을 근거와 함께 종합 관찰 일지로 남기고, 학생은 다음 점검 행동을 정한다. 새 문항 독립 적용은 별도 결과로 저장한다 (과제가 없으면 미확인).
