# 문제 패키지 BASIC-Q1 — 가이드 6장 구조
# 실제 출제 문제: 「논술학습 6단계 기본과정 출제 문제 1」 (교육과정 설계 책임자 출제, 2026-10).
# 제시문 (가)~(라)는 박경귀 저작에서 발췌한 원문이다. 학생 화면에는 출처를 싣지 않는다.
# 출제자 예시답안은 아직 받지 않아 비워 둔다.
# visibility 는 엔진이 화면·AI 로 보낼 범위를 결정하는 데 쓴다 (12장).
