exam:
  title: 논술학습 6단계 기본과정 출제 문제 1
  points: 100
  minutes: 100
  passages:
    - id: "가"
      paragraphs:
        - {id: "가-1", text: "변론가들은 승소하기 위해 무엇에 중점을 두었을까? 우선은 사실관계의 증명이다. 유언장이나 유력한 친족의 증언, 기타 유리한 공적 의례의 사실 증거 등을 동원했다. 아울러 소송 제기자 주장의 신뢰에 의문이 들도록 과거의 부적절한 행적이나 공공생활에서의 의무 태만 등을 폭넓게 지적하기도 했다."}
        - {id: "가-2", text: "이러한 정황 증거는 다툼의 논점으로 중요하게 다루어졌다. 서로 많은 재산을 차지하겠다고 다투는 상속 소송에서 소송 제기자의 과거 비행과 부도덕성은 배심원들에게 중요한 판단 기준이 되기 때문이다."}
        - {id: "가-3", text: "이런 차원에서 변론에는 소송 제기자가 평소 레이투르기아(Leitourgia), 즉 공적 의무를 얼마나 성실히 수행했는가를 입증하는 내용이 빠짐없이 나오는 것을 볼 수 있다. 소송 당사자들이 연극 공연에서 합창단의 후원을 얼마나 했는지, 세금은 제대로 납부했는지, 부유한 사람의 경우 주력 전선(戰船)인 삼단노선 운영을 위해 선원을 모집하고 항해를 지휘하는 일에 얼마나 복무했는지 등이 소송 당사자들의 신뢰성 판단에 중요한 정황 증거가 되었다."}
        - {id: "가-4", text: "배심원을 설득하는 데 있어서 법률적 증거 못지않게 소송 당사자들이 공동체에 기여한 정황 증거 또한 시민과 한 인간으로서의 품성과 자질을 바탕으로 주장의 진정성을 판단하는 잣대가 되었던 것이다. 아테네 민주주의의 존속에 기여하는 시민적 덕성 역시 재판에 큰 영향을 미쳤다는 점이 이채롭다."}
    - id: "나"
      paragraphs:
        - {id: "나-1", text: "그가 자신을 다잡으며 그토록 정진한 이유는 무엇이었을까. 내면의 수양을 통한 인격의 완성 그 자체가 삶의 전부는 아니었던 것 같다. 그는 자신을 끊임없이 연마시켜 현실의 사회적 의무 실행의 동력으로 연결하고자 했다."}
        - {id: "나-2", text: "그는 이성적인 존재는 공동체적 존재이기도 하므로 국가 공동체에서 시민들의 지적 능력과 이성과 법의식이 더욱 다져져야 한다고 보았다. 따라서 그의 인격 수양 노력은 내면의 소극적 차원이 아니라 공동체에 기여할 리더로서 고귀한 품성을 갖추고자 했던 더 높은 차원의 적극적 행동이었던 것이다."}
        - {id: "나-3", text: "이런 맥락에서 그는 사회 구성원들은 이기와 쾌락, 충동적 행위에 휩쓸리지 말고 공동체를 위한 활동을 목표로 삼아야 한다고 생각한 것 같다. “목적 없이 무턱대고 행동하지 마라. 공동체에 유익한 것만을 네 행동 목표로 삼아라”고 자신에게 지속적으로 요구한 이유다. 노블레스 오블리주(noblesse oblige)를 실천하기 위해 노심초사하던 철인 황제의 면모를 여실히 읽을 수 있다."}
        - {id: "나-4", text: "“나는 나와 동종인 부분과 밀접한 관계를 맺고 있는 한 공동체에 반하는 행동을 하지 않고, 오히려 내 모든 노력을 공동체에 유익하도록 조절하고 그와 반대되는 것을 삼가게 될 것이다. 이런 원칙을 지켜 나가면, 동료 시민들에게 유익한 일을 하나씩 실행해 나가고 공동체가 부과하는 의무를 기꺼이 받아들이는 시민의 삶이 행복하리라고 네가 생각할 수 있듯이, 삶은 행복할 수밖에 없을 것이다.”"}
        - {id: "나-5", text: "그가 재위하던 2세기 말은 페스트가 크게 유행하여 시민의 삶이 피폐해지고, 게르만족의 침입으로 군사적 어려움에 시달리는 등 내우외환으로 로마의 전성기가 저물어 가기 시작하는 상황이었다. 그는 외적의 침입에 대비하여 방비에 헌신해야 했고, 사회의 기강과 도덕성을 바로 세우고자 고심했다. 그는 도나우강 전선에서 죽음을 맞이할 때까지 현실의 적은 물론 자기 내면의 적과도 끊임없는 전쟁을 벌였던 것이다."}
        - {id: "나-6", text: "마르쿠스 아우렐리우스에게 인간 세상에서 최고의 권력자였던 황제의 호방한 기개, 카리스마, 넘치는 오만과 독선의 자취를 발견하기 어렵다. 자연의 섭리를 마음으로 수용하고 경건한 삶의 자세로 자신의 내면을 다스리고 로마의 국가 공동체를 유지·발전시키려 애쓰던 위대한 철인 황제의 모습이 그의 비망과 잠언에 절절하게 배어 있다."}
    - id: "다"
      paragraphs:
        - {id: "다-1", text: "이순신은 발포만호 시절 직속 상관인 수사가 거문고를 만들기 위해 진영 내에 있던 오동나무를 베어 가려 할 때 공물을 사사로이 처분할 수 없다며 거절했다. 또 정여립 사건에 연루된 조대중의 압수 물품에서 이순신의 안부 편지가 발견되었을 때, 친구인 금오랑이 이를 빼 주겠다고 제의하자 공물을 사적으로 처분하는 것은 옳지 못하다며 역시 단호하게 거절했다."}
        - {id: "다-2", text: "이는 철저한 선공후사(先公後私)의 자세이다. 자신도 국사범(國事犯)으로 몰릴 수 있는 처지에서 스스로 부끄러움이 없기에 훗날 어떤 모함을 당할지도 모를 상황에서도 선공후사의 정신을 떳떳하게 실천할 수 있었던 것이다. 보통 사람으로서는 그리하기 쉽지 않은 일임에 틀림없다."}
        - {id: "다-3", text: "선공후사는 자신의 이익을 추구하는 사심(私心)을 버릴 때 가능하다. 이순신은 전투에 임하여 전공(戰功)을 먼저 생각하지 않았다. 당시는 적의 수급(首級)의 수로 전공의 우열을 가리던 상수공법(上首功法)이 시행되었다. 이에 원균과 수하 장졸은 전공을 인정받기 위해 전투보다 적의 수급을 취하는 데 더 열중했다. 하지만 이순신은 “나는 적을 죽이기만 하면 비록 목을 베지 못하더라도 힘써 싸운 자를 제일의 공로자로 인정하겠다. 너희들의 용전(勇戰) 여부는 내가 직접 보고 있지 않은가.”라며 개인적 전공보다 적을 무찌르는 나라의 일이 더 중요함을 강조했다."}
        - {id: "다-4", text: "이렇듯 정성과 사랑, 자력과 정의의 가치관과 선공후사의 자세가 이순신의 삶을 관통했다는 것은 노산 이은상 선생의 표현대로 그가 내면의 수양이 깊은 ‘정돈된 인격자’였음을 말해 준다는 것이다."}
    - id: "라"
      paragraphs:
        - {id: "라-1", text: "중국의 전통적 공의 개념은 전제군주가 공을 빙자한 사의 개념적 측면이 강했다. 청조 말 무명씨의 《공사편(公私篇)》이 이를 정확히 짚어 낸다. “중국인은 공천하주의(公天下主義)를 취하여 사람마다 나라를 사사로이 하지 않았지만, 군주 혼자서 사사로이 하도록 방치하였기 때문에 결국 군주의 사의 구실밖에 하지 못하였다.” 이런 상황이 서구의 근대적 공·사 개념에 다가갈 수 있었던 기회를 차단하고 있었던 셈이다."}
        - {id: "라-2", text: "청말의 개혁가 캉유웨이(康有爲, 1858~1927)는 “천의 공리(公理)를 가지고 말하면, 사람에게는 각자 자주독립의 권한이 있으니 평등하다”며 자유 평등의 중요성을 강조했다. 하지만 그가 말하는 자유 평등은 사적 권리를 보장하는 시민적 자유를 의미하는 것은 아니었다. 더구나 개인과 개인 사이의 권리를 보장하는 시민적 평등을 뜻하지도 않았다."}
        - {id: "라-3", text: "따라서 서구에서 개인의 사적 권리와 평등을 전제로 한 계약의 관계로 태동한 공동체로서의 공의 개념과는 거리가 있다. 캉유웨이는 황제의 사적(私的) 공을 공격하는 방편으로 무사(無私)를 강조했을 뿐이다. 다시 말해 소수 만주족이 지배하던 청조의 전제를 사(私)로 보고, 한족의 반전제(反專制) 의식을 각성시키기 위한 것이었을 뿐 ‘자유 평등의 공’이 개개인의 자유와 평등에 대한 인식에서 나온 것은 아니란 의미다."}
        - {id: "라-4", text: "따라서 청말 시기에 개인을 부정하는 반개인적 차원의 민권운동은 개인의 권리와 자유를 보장하는 서구적 개념의 공사관(公私觀)으로 나아가지 못했다. 오히려 개인이 부재한 천하보편의 공으로 환원된 측면이 강하다. 이는 결과적으로 개인의 사적 권리와 자유의 보장에 대한 관심보다 인민 전체로서의 평등에 대한 관심만 높여 주어, “당초부터 사회주의로의 지향을 유연하게 했다.”"}
        - {id: "라-5", text: "태평천국운동과 손문의 신해혁명 역시 이런 사상적 상황 아래서 사회주의적 경향을 띠지 않을 수 없었던 것이다. 물론 저자는 “천하보편의 공이 청나라 말기에 반개사(反個私)=반전제(反專制)라는 국민적 ‘자유평등의 공’으로서 중국적으로 근대화되었던 것”이라고 옹호하고 있긴 하지만 설득력이 약하다. ※ (라)의 ‘저자’는 미조구치 유조를 가리킨다."}
  prompt: 제시문 (다)를 제시문 (가)와 (나)의 관점에서 각각 설명하고, 두 설명의 초점 차이를 밝히시오.
  conditions:
    - 100점, 700자 이내
    - ※ 공백과 문장부호를 포함한 본문 글자 수를 기준으로 한다. 제목은 요구하지 않는다.


designated_passages: ["가", "나", "다"]   # 논제가 활용을 지정한 제시문. (라)는 자료에 있으나 이번 문항에서 지정하지 않음

required_tasks:
  - {id: T1, text: (가)의 관점으로 (다)의 인물 설명}
  - {id: T2, text: (나)의 관점으로 (다)의 인물 설명}
  - {id: T3, text: 두 설명의 초점 비교}
non_required_tasks: [인물에 대한 찬반 평가, 인물의 생애·업적 소개, 제시문 밖 역사 지식(임진왜란 전투 등)]

passage_roles:
  - {id: "가", role: 공동체에 기여한 정황(공적 의무 수행)이 당사자의 품성과 주장의 진정성·신뢰성을 판단하는 잣대가 된다는 관점}
  - {id: "나", role: 내면의 수양이 그 자체로 끝나지 않고 공동체에 기여하는 적극적 행동(사회적 의무 실행)의 동력이 된다는 관점}
  - {id: "다", role: 두 관점을 적용할 사례. 공물의 사적 처분 거절, 전공보다 나라의 일, 사심을 버린 선공후사, 내면 수양이 깊은 정돈된 인격자}

key_concepts:
  - {term: 레이투르기아(공적 의무), meaning: 아테네 시민이 공동체를 위해 수행한 후원·납세·복무 등의 의무, refs: ["가-3"], stages: ["1", "2", "3"]}
  - {term: 정황 증거와 신뢰성, meaning: 공동체 기여의 정황이 품성과 주장의 진정성을 판단하는 잣대가 됨, refs: ["가-2", "가-4"], stages: ["2", "3"]}
  - {term: 내면 수양과 사회적 의무, meaning: 자신을 연마한 결과를 공동체를 위한 행동의 동력으로 연결함, refs: ["나-1", "나-2"], stages: ["2", "4"]}
  - {term: 노블레스 오블리주, meaning: 높은 지위에 따르는 공동체에 대한 의무의 실천, refs: ["나-3"], stages: ["4"]}
  - {term: 선공후사, meaning: 사심을 버리고 공적인 일을 먼저 함, refs: ["다-2", "다-3"], stages: ["3", "4"]}

explanation_criteria:
  ga: 이순신이 공적 의무에 충실하고 공물을 사사로이 처분하지 않은 행적은 그의 품성과 신뢰성(주장의 진정성)을 판단하는 정황 증거가 된다
  na: 이순신의 선공후사는 사심을 버린 내면 수양(정돈된 인격)이 공동체(나라)를 위한 행동으로 이어진 것이다
  axis: (가)는 공동체 기여 행적이 남에게 신뢰를 판단하게 하는 근거라는 점(평가자의 시선), (나)는 그 행동을 낳은 행위자 내면의 수양이라는 점(행위의 근원)에 초점

error_patterns:
  # ---- 0단계 (설계 2026-11-14 Ⅶ 보충 경로)
  - code: topic_or_opinion
    issue_type: not_linked_to_task
    stages: ["0"]
    signal: 주제만 말하거나 자신의 평가(훌륭함·중요함)를 쓰는 문제로 이해
    demo_signals: [왜 중요한지, 훌륭, 존경, 위대, 좋은 사람, 쓰는 문제 같, 대한 내 생각, 대한 의견]
    first_question: 논제에서 방금 말한 일을 요구하는 표현을 찾아볼까요?
    purpose: 주제와 수행을 구별하기
    rubric_refs: [A1, A2]
  - code: role_swap
    issue_type: false_identity
    stages: ["0"]
    signal: 설명 대상과 관점을 뒤바꿈
    demo_signals: ["(가)를 (다)", "(나)를 (다)", "(다)의 관점", "다의 관점"]
    first_question: ‘무엇을’ 설명하는지와 ‘어떤 관점에서’ 설명하는지 나누어 읽어 볼까요?
    purpose: 대상과 관점의 관계 다시 설명하기
    rubric_refs: [A1]
  - code: single_task
    issue_type: not_linked_to_task
    stages: ["0"]
    signal: 한 가지 요구만 하고 끝내도 된다고 봄
    demo_signals: [설명만 하면, 요약하면 된, 설명하면 끝, 하나만 하면]
    first_question: 그렇게 하면 논제의 요구가 모두 끝나는지 논제 뒷부분을 다시 볼까요?
    purpose: 전체 과업을 다시 구성하기
    rubric_refs: [A1]
  - code: overclaim
    issue_type: overclaim
    stages: ["1", "3"]
    signal: 원문보다 강한 표현으로 단정
    demo_signals: [반드시, 무조건, 언제나 옳, 믿어야 한, 틀림없]
    first_question: 원문의 어느 대목이 그만큼 강하게 말하고 있나요?
    purpose: 원문이 말한 범위 안에서 표현하기
    rubric_refs: [B3]
  - code: trust_equals_truth
    issue_type: overclaim
    stages: ["2", "3", "4", "6.1"]
    signal: (가)의 정황 증거를 주장이 참이라는 증명 또는 유일한 판단 기준으로 단정
    demo_signals: [주장이 옳, 말이 옳, 말은 다 맞, 항상 맞, 언제나 옳, 무조건 이긴, 유일한 기준]
    first_question: (가)는 공동체에 기여한 정황을 법률적 증거와 어떤 관계로 설명하나요?
    purpose: 정황 증거가 '판단의 잣대'일 뿐 사실의 증명이나 유일한 기준이 아님을 구별
    rubric_refs: [B1, B3]
  - code: outer_only_inner_only
    issue_type: false_dichotomy
    stages: ["1", "2", "4", "6.1"]
    signal: (가)는 외면만, (나)는 내면만 본다고 단정
    demo_signals: [외면만, 내면만, 겉만, 속만, 정반대, 반대되는]
    first_question: 한 글이 다른 글의 내용을 부정하고 있나요?
    purpose: 두 관점의 초점 차이를 대립으로 오해하지 않기
    rubric_refs: [D2]
  - code: case_as_claim
    issue_type: case_as_claim
    stages: ["1", "2"]
    signal: 제시문의 사례나 인물을 주장으로 착각
    demo_signals: [이순신은 훌륭, 이순신이 주장, 이순신은 위대]
    first_question: 지금 말한 것은 제시문의 주장인가요, (다)의 사례인가요?
    purpose: 관점과 사례 구별
    rubric_refs: [A1]
  - code: background_knowledge
    issue_type: background_knowledge
    stages: ["0", "1", "2", "3", "4", "5"]
    signal: 제시문 밖 지식으로 설명
    demo_signals: [역사적으로, 들어 보니, 인터넷, 배운 적, 임진왜란, 거북선, 명량, 한산도, 노량]
    first_question: 그 내용은 제시문의 어느 문단에서 확인할 수 있나요?
    purpose: 제시문 근거로 돌아오기
    rubric_refs: [A2]
  - code: not_linked_to_task
    issue_type: not_linked_to_task
    stages: ["5"]
    signal: 논제의 요구와 연결되지 않은 내용 배치
    demo_signals: [찬성, 반대 입장, 생애, 존경]
    first_question: 이 내용은 논제의 세 요구 가운데 무엇에 답하나요?
    purpose: 비필수 내용 덜어 내기
    rubric_refs: [A2]

# 단계별 보충 경로 문구 (0단계 설계 Ⅶ). 숫자는 보충 사다리 칸. 4칸 이상은 '지원 후 이해'로 기록된다.
stage_ladders:
  "0":
    "2": "논제를 짧게 나눠 볼게요. ① ‘제시문 (다)를’ ② ‘(가)와 (나)의 관점에서 각각 설명하고’ ③ ‘두 설명의 초점 차이를 밝히시오’. 먼저 ①과 ②가 각각 무엇을 말하는지 하나씩 볼까요?"
    "3": "빈칸을 채워 볼까요? 설명할 대상: ____ / 사용할 관점: ____ / 설명한 뒤 추가로 할 일: ____"
    "4": "도움말: 이 논제는 (다)를 설명 대상으로 삼고 (가)와 (나)를 관점으로 써서 각각 설명한 다음, 두 설명이 어디에 초점을 두는지 견주라는 뜻이에요. 이제 이 도움말을 보지 않고 내 말로 다시 정리해 볼까요?"
    "5": "도움말을 가리고, 이번 답안에서 해야 할 일 세 가지를 내 말로 다시 적어 볼까요?"
    answer_request: "정답보다 먼저, 논제 원문에서 필요한 부분부터 같이 확인해 봐요."
    vague: "‘{quote}’라는 말만으로는 준비가 됐는지 알기 어려워요. 무엇을 어떻게 확인할지 구체적으로 말해 볼까요?"
    undesignated: "이번 논제에서 직접 활용하라고 지정한 제시문을 찾아볼까요?"
    no_response: "편한 방식으로 해도 괜찮아요. 한 문장이나 낱말 몇 개로 짧게 메모해도 돼요. 논제에서 ‘하시오’로 끝나는 말을 하나만 골라 볼까요?"

# 문제별 하위 목표 구체화 (단계 카드 + 이 문제). demo_signals 는 데모 튜터의 충족 판단용 낱말 묶음
# (묶음마다 하나 이상이 나오면 충족). 실제 AI 튜터는 criterion 문장으로 판단한다.
stage_overrides:
  # 0단계 (설계 2026-11-14): 한 응답에서 여러 항목을 동시에 확인한다
  S0-1: {criterion: "설명하기·초점 차이 밝히기 등 논제가 요구한 활동을 말함", demo_signals: [[설명, 비교, 차이, 밝히]], first_question: "논제에서 행동을 요구하는 표현을 찾아볼까요?"}
  S0-2: {criterion: "설명 대상은 (다), 설명에 쓰는 관점은 (가)와 (나)임을 논제 문장에 근거해 구별", demo_signals: [["(다)를", "다를", 대상], [관점]], first_question: "이 문장에서 설명받는 대상은 무엇일까요?"}
  S0-3: {criterion: "‘각각’ 두 번 설명한 뒤 ‘두 설명’의 초점 차이까지 밝혀야 함을 인식", demo_signals: [[각각, 두 설명, 둘 다, 따로], [차이, 초점, 비교]], first_question: "‘두 설명’은 앞의 어떤 활동을 가리킬까요?"}
  S0-4: {criterion: "원문에서 관점·사례의 연결 근거(대목)를 찾아 확인하겠다고 말함", demo_signals: [[근거, 대목, 뒷받침, 원문, 문장을 찾]], first_question: "그 설명이 맞는지 무엇으로 확인할 건가요?"}
  S0-5: {criterion: "700자 이내, 공백·문장부호 포함, 제목 없음 등 작성 조건 확인", demo_signals: [["700"]], first_question: "작성 조건에서 지켜야 할 사항을 찾아볼까요?"}
  S0-6: {criterion: "모르는 내용과 더 읽고 확인할 부분을 구별", demo_signals: [[아직, 모르, 확인하지 못, 더 읽, 불확실, 표시]], first_question: "지금 확정하지 않고 더 읽어야 할 부분은 무엇일까요?"}
  S1-1: {criterion: "(가): 공적 의무(레이투르기아)를 성실히 수행했는지가 당사자의 신뢰성과 주장의 진정성을 판단하는 정황 증거가 됨", demo_signals: [[공적 의무, 레이투르기아, 기여, 공동체], [신뢰, 진정성, 판단, 잣대]], first_question: "(가)에서 배심원은 무엇을 보고 소송 당사자를 믿을 만한지 판단했나요?"}
  S1-2: {criterion: "(나): 내면의 수양이 그 자체로 끝나지 않고 공동체를 위한 사회적 의무 실행의 동력이 됨", demo_signals: [[수양, 연마, 내면, 다잡], [공동체, 의무, 동력, 행동]], first_question: "(나)의 인물은 자신을 연마한 결과를 무엇으로 연결하려 했나요?"}
  S1-3: {criterion: "원문보다 강한 표현(언제나·무조건·유일한)을 쓰지 않음", demo_signals: [[못지않게, 함께, 뿐, 잣대]], first_question: "(가)-4 문단은 정황 증거를 법률적 증거와 어떤 관계로 말하나요?"}
  S2-1: {criterion: "(가)의 기준 = 공동체에 기여한 행적(공적 의무 수행)으로 품성·신뢰성을 판단", demo_signals: [[행적, 기여, 의무, 정황]], first_question: "(가)는 사람을 판단할 때 무엇을 보라고 하나요?"}
  S2-2: {criterion: "(나)의 기준 = 내면을 수양했는가, 그것이 공동체를 위한 행동으로 이어지는가", demo_signals: [[수양, 내면, 인격, 연마]], first_question: "(나)는 드러난 행동의 근원으로 무엇을 보나요?"}
  S2-3: {criterion: "공통 축 = 인물을 판단(설명)하는 근거를 바깥으로 드러난 기여 행적에서 찾는가, 행동을 낳은 안의 수양에서 찾는가", demo_signals: [[근거, 기준, 초점], [바깥, 드러, 안, 내면]], first_question: "두 기준을 한 줄에 놓고 비교하려면 무엇을 공통으로 물어야 할까요?"}
  S3-1: {criterion: "다-1 오동나무·편지 등 공물의 사적 처분 거절, 다-3 전공보다 나라의 일", demo_signals: [[다-1, 오동나무, 공물, 편지, 다-3, 전공, 수급]], first_question: "(다)에서 이순신이 공적 의무를 지킨 행동은 어느 문단에 있나요?"}
  S3-2: {criterion: "그런 공적 행적이 그의 품성과 신뢰성(진정성)을 판단하는 근거가 된다고 설명", demo_signals: [[신뢰, 믿, 품성, 진정성, 판단]], first_question: "(가)의 배심원이라면 이순신의 이런 행적을 어떻게 받아들일까요?"}
  S3-3: {criterion: "행적은 판단의 잣대(정황 증거)이지, 그 자체로 모든 판단을 대신하지는 않음", demo_signals: [[잣대, 정황, 못지않게, 근거가 될]], first_question: "(가)-4는 정황 증거를 어떤 역할로 설명하나요?"}
  S4-1: {criterion: "다-2·3 사심을 버린 선공후사, 다-4 내면 수양이 깊은 정돈된 인격자", demo_signals: [[선공후사, 사심, 정돈된, 인격, 다-2, 다-4, 부끄러움]], first_question: "(다)에서 (나)가 중시하는 내면의 모습은 어느 문단에 있나요?"}
  S4-2: {criterion: "(가)는 밖으로 드러난 기여 행적과 그에 대한 판단, (나)는 행동을 낳은 안의 수양에 초점", demo_signals: [[초점, 차이, 다르], [행적, 바깥, 드러, 판단], [수양, 내면, 안]], first_question: "2단계에서 정한 공통 기준으로 두 설명을 나란히 놓으면 무엇이 다른가요?"}
  S4-3: {criterion: "(나)도 공동체를 위한 행동으로 이어진다고 보므로 둘을 대립으로 만들지 않음", demo_signals: [[이어, 함께, 부정하지, 연결, 동력]], first_question: "(나)-1·2 문단은 수양과 공동체를 위한 행동의 관계를 어떻게 말하나요?"}
  S5-1: {criterion: "1문단 (가) 설명, 2문단 (나) 설명, 3문단 비교 (또는 타당한 다른 배치)", demo_signals: [[문단], [비교]], first_question: "세 요구를 각각 몇 번째 문단에 둘까요?"}
  S5-2: {criterion: "문단별 근거 문단 지정", demo_signals: [[가-, 나-, 다-]], first_question: "2문단에서 쓸 근거는 어느 문단인가요?"}
  S5-3: {criterion: "찬반·생애·전투 업적 등 비필수 내용과 (라) 제외", demo_signals: [[빼, 제외, 넣지, 안 쓰]], first_question: "개요에서 논제가 요구하지 않는 내용이 있나요?"}


exemplars:
  # ---- 0단계 주 시뮬레이션 (설계 2026-11-14 Ⅵ). 말투와 질문 수준만 참고하고 내용을 재현하지 않는다.
  - stage: "0"
    subgoal: S0-1
    tags: [topic_or_opinion]
    turns:
      - {role: tutor, text: "논제를 읽고, 이번 답안에서 해야 할 일을 자신의 말로 설명해 보세요. 아직 제시문 내용을 완전히 분석하지 않아도 돼요."}
      - {role: student, text: "공동체를 위해 행동하는 것이 왜 중요한지 쓰는 문제 같아요. 이순신이 훌륭한 인물이라는 걸 설명하면 될 것 같아요."}
      - {role: tutor, text: "논제에서 방금 말한 일을 요구하는 표현을 찾아볼까요?"}
      - {role: student, text: "그대로 요구한 표현은 없어요. ‘(다)를 (가)와 (나)의 관점에서 각각 설명’하라고 되어 있어요."}
      - {role: tutor, text: "그렇다면 ‘훌륭하다’는 내 평가만으로 그 요구에 답할 수 있을까요?"}
  - stage: "0"
    subgoal: S0-2
    tags: []
    turns:
      - {role: tutor, text: "무엇을 설명해야 하고, 설명할 때 무엇을 사용해야 할까요?"}
      - {role: student, text: "(다)를 설명해야 하고, (가)와 (나)의 관점을 사용해야 해요."}
      - {role: tutor, text: "그 구별은 논제의 어느 표현에 근거한 건가요?"}
  - stage: "0"
    subgoal: S0-3
    tags: [single_task]
    turns:
      - {role: tutor, text: "여기서 ‘각각’이라는 말은 답안에 어떤 차이를 만들까요?"}
      - {role: student, text: "(가)와 (나)를 묶어서 한 번 설명하기보다, 각 관점으로 (다)를 설명해야 한다는 뜻이에요."}
      - {role: tutor, text: "그렇게 설명하면 논제의 요구가 모두 끝날까요?"}
      - {role: student, text: "아니요. ‘두 설명의 초점 차이를 밝히시오’도 있어요."}
      - {role: tutor, text: "‘두 설명’은 무엇을 가리킬까요?"}
  - stage: "0"
    subgoal: S0-4
    tags: []
