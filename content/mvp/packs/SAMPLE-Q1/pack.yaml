      - {role: student, text: "공동체를 위해 행동하는 것이 왜 중요한지 쓰는 문제 같아요. 박정우가 훌륭한 인물이라는 걸 설명하면 될 것 같아요."}
      - {role: tutor, text: "논제에서 방금 말한 일을 요구하는 표현을 찾아볼까요?"}
      - {role: student, text: "그대로 요구한 표현은 없어요. ‘(다)를 (가)와 (나)의 관점에서 각각 설명’하라고 되어 있어요."}
      - {role: tutor, text: "그렇다면 ‘훌륭하다’는 내 평가만으로 그 요구에 답할 수 있을까요?"}
  - stage: "0"
