      - {role: student, text: "(가)와 (나)를 묶어서 한 번 설명하기보다, 각 관점으로 (다)를 설명해야 한다는 뜻이에요."}
      - {role: tutor, text: "그렇게 설명하면 논제의 요구가 모두 끝날까요?"}
      - {role: student, text: "아니요. ‘두 설명의 초점 차이를 밝히시오’도 있어요."}
      - {role: tutor, text: "‘두 설명’은 무엇을 가리킬까요?"}
  - stage: "0"
