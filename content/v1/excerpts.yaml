# 제시문 (승인 발췌문 계층). 학생 화면에는 label 과 paragraphs, marks 만 표시된다.
# source 는 내부 검증 정보이며 학생에게 노출하지 않는다 (P-018).
# 이 파일의 모든 글은 시범 운영용 신규 설계문이다. 실제 저작의 인용이 아니며,
# 운영 탑재 전에 승인된 발췌문 또는 검토된 자료로 교체한다 (S1-130·S2-033·S3-007).

# ---------------- 제1학습 주제 ----------------
- id: l1_ga
  label: "(가)"
  kind: lesson
  paragraphs:
    - 그 장수는 부하들 사이에서 너그럽고 공정한 사람으로 불렸다. 그러나 그가 공정하다는 평을 들은 까닭은 모두에게 똑같이 나누어 주었기 때문이 아니었다.
    - 그는 싸움이 끝나면 얻은 물자를 병사 수대로 똑같이 나누지 않았다. 앞장서서 위험을 감당한 사람, 동료를 구한 사람, 맡은 일을 끝까지 해낸 사람에게 더 많은 몫을 주었고, 그 기준을 싸움에 나서기 전에 모두에게 알렸다.
    - 대신 그는 누구에게나 공을 세울 기회를 똑같이 열어 두었다. 출신이나 친분 때문에 중요한 임무에서 빠지는 병사는 없었고, 새로 들어온 병사도 공을 세우면 오래된 병사와 같은 기준으로 보상을 받았다.
    - 그러자 병사들은 서로를 시기하기보다 더 나은 성과를 내려고 겨루었다. 처음에는 몫이 다르다는 데 불만을 품고 똑같이 나눠 달라고 요구하던 사람들도, 기준이 미리 정해져 있고 기회가 모두에게 열려 있다는 것을 알게 되자 결과를 받아들였다.
  source: {title: "시범용 신규 설계문", location: "제1학습 주제 기본 제시문", note: "배분 기준(기여에 따른 보상)과 기회의 동등함 대조", is_sample: true}

- id: l1_demo
  label: "연습문"
  kind: demo
  paragraphs:
    - 우리 모둠은 발표 준비를 할 때 처음에는 모든 일을 다 같이 했다. 그러자 자료 조사는 겹치고 발표 연습은 아무도 챙기지 않았다. 역할을 나누어 각자 맡은 일을 책임지게 하자 준비가 훨씬 빨라졌다.
  source: {title: "시범용 연습문", note: "설명·시범 전용. 재확인 과제에 쓰지 않음 (S1-108)", is_sample: true}

- id: l1_check
  label: "(나)"
  kind: independent
  paragraphs:
    - 우리 학교 도서관에는 한때 규칙이 서른 가지가 넘었다. 규칙이 많아지면 질서가 잡힐 것이라 생각했지만, 학생들은 무엇을 지켜야 하는지조차 잘 알지 못했다.
    - 도서관 운영 위원들은 규칙을 다섯 가지로 줄이고, 규칙마다 왜 필요한지를 한 줄씩 적어 입구에 붙였다. 조용히 해야 하는 이유, 책을 제자리에 두어야 하는 이유를 학생들이 직접 읽을 수 있게 한 것이다.
    - 그 뒤로 규칙을 어기는 일은 오히려 줄었다. 학생들은 규칙을 감시를 피하는 대상이 아니라 함께 지키는 약속으로 여기기 시작했다.
  source: {title: "시범용 신규 설계문", location: "제1학습 주제 독립 확인", note: "다른 주제·비슷한 난도. 규칙은 수보다 이유가 공유될 때 지켜짐", is_sample: true}

- id: s1_recheck
  label: "(다)"
  kind: recheck
  paragraphs:
    - 어느 마을은 해마다 축제 준비를 몇몇 어른에게만 맡겼다. 일은 빨리 끝났지만, 마을 사람 대부분은 축제를 남의 일처럼 여겼다.
    - 어느 해부터 마을은 준비 과정을 공개하고, 누구든 원하는 일을 골라 참여할 수 있게 했다. 준비는 조금 늦어졌지만, 참여한 사람들은 자기가 맡은 부분을 끝까지 책임졌다.
    - 축제가 끝난 뒤 사람들은 그해 축제를 '우리가 만든 축제'라고 불렀다.
  source: {title: "시범용 신규 설계문", location: "제1학습 주제 보충 재확인", note: "참여 기회가 열릴 때 공동의 일에 대한 책임감이 생김", is_sample: true}

# ---------------- 제2학습 주제 ----------------
- id: l2_ga
  label: "(가)"
  kind: lesson
  paragraphs:
    - 오래된 한 이야기에서, 도시의 통치자는 도시를 공격하다 죽은 반역자의 시신을 묻지 말라고 명령한다. 반역자를 기리지 못하게 해야 도시의 질서가 바로 선다고 믿었기 때문이다.
    - 반역자의 누이는 이 명령을 어기고 오빠의 시신을 묻는다. 그녀는 가족을 묻어 주는 일은 어떤 통치자의 명령보다 앞서는 의무라고 믿었다. 결국 그녀는 붙잡혀 벌을 받고, 통치자 역시 가족을 잃는 불행을 겪는다.
    - 이 이야기를 한쪽은 옳고 다른 쪽은 그르다는 이야기로만 읽으면 중요한 것을 놓친다. 통치자에게는 도시의 질서를 지킬 의무가 있었고, 누이에게는 가족을 돌볼 의무가 있었다. 두 사람 모두 자신이 지켜야 할 의무에 근거해 행동했다.
    - 그러므로 이 이야기의 비극은 악한 사람이 선한 사람을 해쳤다는 데서 생기지 않는다. 각자 정당한 이유를 가진 두 의무가 한 사건에서 부딪쳤기 때문에 생긴다고 보아야 한다.
  source: {title: "시범용 신규 설계문", location: "제2학습 주제 기본 제시문", note: "필자 판단(두 의무의 충돌)과 인물의 믿음 구별, 사건 결과와 정당화 구별", is_sample: true}

- id: l2_demo
  label: "연습문"
  kind: demo
  paragraphs:
    - 급식 시간에 줄을 서는 규칙은 지켜야 한다. 줄을 서지 않으면 늦게 온 사람이 먼저 먹게 되어, 먼저 기다린 사람이 손해를 보기 때문이다.
  source: {title: "시범용 연습문", note: "판단(지켜야 한다)과 이유(먼저 기다린 사람의 손해) 구별 시범", is_sample: true}

- id: l2_check
  label: "(나)"
  kind: independent
  paragraphs:
    - 많은 학교가 휴대전화를 수업 시간에 걷어 간다. 집중을 방해한다는 이유에서다.
    - 그러나 휴대전화를 걷는 것만으로 집중력이 길러지지는 않는다. 학생이 스스로 언제 휴대전화를 내려놓아야 하는지 판단해 본 경험이 없으면, 걷어 가지 않는 곳에서는 다시 화면에 빠지기 때문이다.
    - 따라서 학교는 휴대전화를 무조건 걷기보다, 학생이 사용 시간을 스스로 정하고 지켜 보는 기회를 함께 마련해야 한다.
  source: {title: "시범용 신규 설계문", location: "제2학습 주제 독립 확인", note: "판단(기회를 함께 마련해야)과 이유(스스로 판단한 경험이 없으면 다시 빠짐), 숨은 연결 재구성 가능", is_sample: true}

- id: s2_recheck
  label: "(다)"
  kind: recheck
  paragraphs:
    - 어떤 사람들은 시험 성적만으로 학생을 평가하는 것이 가장 공정하다고 말한다. 모두가 같은 문제를 풀기 때문이다.
    - 하지만 같은 문제를 푼다고 같은 조건에서 공부한 것은 아니다. 어떤 학생은 도움을 받을 곳이 많았고, 어떤 학생은 혼자 공부해야 했다.
    - 그러므로 공정한 평가를 원한다면 성적과 함께 학생이 어떻게 성장했는지도 살펴야 한다.
  source: {title: "시범용 신규 설계문", location: "제2학습 주제 보충 재확인", note: "인물·통념의 입장과 필자 판단 구별, 판단과 이유 연결", is_sample: true}

# ---------------- 제3학습 주제 1차 ----------------
- id: l3_ga
  label: "(가)"
  kind: lesson
  paragraphs:
    - 자유는 하고 싶은 대로 다 하는 것이 아니다. 법이 없는 곳에서는 힘센 사람이 약한 사람의 자유를 쉽게 빼앗는다.
    - 그러므로 올바르게 제정된 법을 따르는 것은 자유를 버리는 일이 아니라 모두의 자유를 지키는 일이다. 법을 무시하고 제멋대로 행동하는 것은 자유가 아니라 방종일 뿐이다.
  source: {title: "시범용 신규 설계문", location: "제3학습 주제 1차 (가)", note: "조건: 올바르게 제정된 법 / 자유와 방종 구별", is_sample: true}

- id: l3_na
  label: "(나)"
  kind: lesson
  paragraphs:
    - 많은 사람의 판단은 한 사람의 판단보다 나을 때가 있다. 여러 사람이 각자 조금씩 아는 것을 모으면 전체를 더 잘 볼 수 있을지도 모른다.
    - 그러나 사람들이 쉽게 흥분하거나 정확한 정보를 갖지 못하면 다수의 판단도 잘못될 수 있다. 그러므로 중요한 일은 다수의 뜻에 맡기되, 그 판단이 법이 정한 절차를 거치도록 해야 한다.
  source: {title: "시범용 신규 설계문", location: "제3학습 주제 1차 (나)", note: "다수 판단의 가능성과 한계를 함께 서술. 잠정 표현(일지도) 유지 (L3-008)", is_sample: true}

- id: l3_demo
  label: "연습문"
  kind: demo
  paragraphs:
    - "원문: 정기 점검을 통과한 놀이 기구는 안전하게 이용할 수 있다. / 해석 문장: 놀이 기구는 안전하게 이용할 수 있다. → 해석 문장에서 '정기 점검을 통과한'이라는 조건이 빠져, 원문보다 넓은 결론이 되었다."
  source: {title: "시범용 연습문", note: "조건 누락 시범(안전 점검 사례, L3-021)", is_sample: true}

# ---------------- 제3학습 주제 2차 ----------------
- id: l3_da
  label: "(다)"
  kind: lesson
  paragraphs:
    - 공직자의 부정은 개인의 욕심만으로 생기지 않는다. 감시가 느슨하고 권한이 한 사람에게 몰리면 평범한 사람도 유혹에 넘어가기 쉽다.
    - 그러므로 부정을 막으려면 권한을 나누고, 결정 과정을 시민이 볼 수 있게 공개하는 제도가 필요하다.
  source: {title: "시범용 신규 설계문", location: "제3학습 주제 2차 (다)", note: "일반 원인과 제도적 대책", is_sample: true}

- id: l3_ra
  label: "(라)"
  kind: lesson
  paragraphs:
    - 한 도시의 지도자는 오랫동안 큰 권한을 가졌지만 재산을 늘리지 않았다고 전해진다. 그는 검소하게 살았고, 공금을 어디에 썼는지 시민들 앞에서 설명하곤 했다.
    - 사람들은 그를 청렴한 지도자로 기억했다.
  source: {title: "시범용 신규 설계문", location: "제3학습 주제 2차 (라)", note: "구체 사례(개인의 청렴). 생활 방식과 청렴은 함께 서술될 뿐 인과는 확정되지 않음", is_sample: true}

- id: s3_recheck
  label: "(마)·(바)"
  kind: recheck
  paragraphs:
    - "(마) 숲을 지키려면 나무를 베는 사람을 엄하게 벌해야 한다. 벌이 약하면 사람들은 쉽게 규칙을 어긴다."
    - "(바) 한 마을은 주민이 숲을 함께 관리하게 한 뒤로 나무를 몰래 베는 일이 줄었다. 자기 숲이라고 여기게 되자 서로를 지켜보게 된 것이다."
  source: {title: "시범용 신규 설계문", location: "제3학습 주제 보충 재확인", note: "처벌(일반 대책)과 공동 관리(사례)의 보완 관계, 사례 범위", is_sample: true}

# ---------------- 제4·5학습 주제 ----------------
- id: l4_ga
  label: "(가)"
  kind: lesson
  marks: {3: "필자 해석"}
  paragraphs:
    - 가족을 아끼는 마음은 사람에게 가장 자연스러운 감정이다. 부모가 자식을 먼저 챙기고 형제가 서로를 돕는 것을 나무랄 사람은 없다.
    - 그러나 공적인 권한을 가진 사람이 그 마음을 그대로 권한 행사에 옮기면 문제가 생긴다. 가족에게 자리를 주거나 일을 몰아주면, 그 기회를 공정하게 얻었어야 할 다른 사람들의 몫이 줄어든다.
    - 옛 사상가 가운데는 나라를 다스리는 사람들이 사사로운 가족을 갖지 않아야 공동체 전체를 가족처럼 돌볼 수 있다고 주장한 이도 있었다. 가족에 대한 애착이 공적인 판단을 흐리지 않게 하려는 생각이었다.
    - 이 주장은 지나쳐 보이지만, 가족애 자체를 없애자는 뜻으로만 읽을 필요는 없다. 공적 권한을 행사할 때만큼은 가족애가 판단의 기준이 되어서는 안 된다는 경고로 읽을 수 있다.
  source: {title: "시범용 신규 설계문", location: "제4·5학습 주제 제시문", note: "목적과 수단, 가족애와 공적 특혜, 인용 사상과 필자 해석 구분. 마지막 문단은 필자 해석 (L4-007)", is_sample: true}

- id: l4_demo
  label: "연습문"
  kind: demo
  paragraphs:
    - "주장: 학급 회의는 다수결로만 정해야 한다. / 반론: 다수결로만 정하면 소수 학생이 늘 손해를 보는 결정이 반복될 수 있다. 이 반론은 주장이 '모든 경우에 공정하다'는 점을 겨냥한다."
  source: {title: "시범용 연습문", note: "실질적 반론 시범. 원래 주장에 대한 반론은 학생이 직접 씀 (L4-047)", is_sample: true}

- id: s4_recheck
  label: "(나)"
  kind: recheck
  paragraphs:
    - 학급 반장에게 급식 순서를 정할 권한이 주어졌다. 반장은 친한 친구들을 늘 앞 순서에 두었다. 친구들은 반장이 의리 있다고 말했지만, 다른 학생들은 불만을 가졌다.
  source: {title: "시범용 신규 설계문", location: "제4학습 주제 보충 재확인", note: "새 논제: 작은 권한을 가진 사람이 지켜야 할 원칙", is_sample: true}
