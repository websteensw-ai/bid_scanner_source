# 제2학습 주제: 주장과 이유 연결하기 (L2-001~L2-045)
id: L2
kind: topic
order: 2
title: 주장과 이유 연결하기
goal: 글쓴이의 판단을 찾아 그 이유와 잇고, 설명과 논증을 구별해요.
intro: 이야기 속 인물이 믿은 것과 글쓴이가 판단한 것을 구별하며 읽어 봐요. 제시문은 언제든 다시 볼 수 있어요.
time_target: 15~20분
next: L3
steps:
  - id: l2_initial
    title: 판단과 이유 잇기
    prompt: 제시문 (가)에서 글쓴이가 직접 내린 판단 하나를 고르고, 그 판단을 뒷받침하는 이유를 연결해 쓰세요. 근거가 된 부분도 적어 주세요.
    excerpts: [l2_ga]
    evidence: true
    vocab:
      반역자: 나라나 도시를 배반한 사람
      통치자: 나라나 도시를 다스리는 사람
      비극: 슬프고 불행한 결말에 이르는 일
    guide: 글쓴이가 ‘~해야 한다’, ‘~라고 보아야 한다’처럼 스스로 판단한 문장을 하나 찾고, 그 판단을 왜 받아들여야 하는지 글에 나온 이유를 이어 쓰는 과제예요. 이야기 속 인물의 생각과 글쓴이의 판단은 다를 수 있어요.
    explanation: "판단은 ‘무엇이 옳다/그르다/~해야 한다’는 생각이고, 이유는 ‘왜 그 판단을 받아들여야 하는가’에 답하는 내용이에요. 판단을 다른 말로 한 번 더 쓰는 것은 이유가 아니에요. 또 사건이 어떻게 끝났는지(결과)는 판단의 이유와 다를 수 있어요."
    demo:
      excerpt: l2_demo
      text: "다른 글로 시범을 보일게요. 연습문의 판단은 ‘급식 줄 규칙은 지켜야 한다’예요. 이유는 ‘줄을 서지 않으면 먼저 기다린 사람이 손해를 보기 때문’이에요. ‘규칙은 중요하다’처럼 판단을 반복하는 것은 이유가 아니에요. 이제 원래 제시문 (가)로 직접 해 보세요."
    criteria:
      - id: j_writer
        desc: 인물의 믿음이 아닌 글쓴이의 판단(두 의무의 충돌·한쪽만 옳다고 볼 수 없음 등)을 골랐다. 다른 타당한 판단도 인정
        evidence_for: [C2]
        skill: "2-6"
        signals: [["두 의무", "둘 다", "모두", "한쪽", "비극", "부딪", "충돌"]]
      - id: j_reason
        desc: 판단을 뒷받침하는 이유(각자 지켜야 할 의무에 근거해 행동함)를 연결했다
        evidence_for: [C2]
        skill: "2-2"
        signals: [["의무"], ["때문", "므로", "이유", "근거", "니까", "에서"]]
      - id: h_link
        desc: (숨은 연결) 이유에서 판단으로 가는 생략된 생각을 드러냈다
        required: false
        signals: [["정당한 이유", "정당화", "옳다고 볼 수", "근거가 있"]]
    errors:
      - id: e_summary
        name: 판단 없이 줄거리 요약
        first_question: 줄거리를 잘 정리했어요. 그중 글쓴이가 직접 ‘~해야 한다’, ‘~라고 보아야 한다’고 판단한 문장은 어디인가요?
        review_item: "2-1"
      - id: e_restate
        name: 결론 반복
        first_question: 쓴 이유가 판단을 다른 말로 반복한 것은 아닌가요? 그 판단을 받아들일 별도의 이유를 제시문에서 찾아보세요.
        review_item: "2-1"
        signals: [["비극이기 때문", "비극적이기 때문", "슬프기 때문"]]
      - id: e_outcome
        name: 사건 결과를 이유로 제시
        first_question: 그 사건의 결과가 글쓴이의 판단을 뒷받침하나요? 사건이 어떻게 끝났는지와, 판단을 뒷받침하는 이유를 구분해 보세요.
        review_item: "2-2"
        signals: [["벌을 받", "불행", "잃었", "죽었"]]
      - id: e_character
        name: 인물 입장을 글쓴이 주장으로 제시
        first_question: 그 생각은 누구의 생각인가요? 이야기 속 인물이 믿은 것과 글쓴이가 평가한 것을 구별해 보세요.
        review_item: "2-6"
        signals: [["명령보다 앞서", "질서가 바로", "묻어 주는 일은"]]
      - id: e_one_side
        name: 한쪽만 옳다고 단순화
        first_question: 글쓴이는 한쪽만 옳다고 보았나요? 셋째 문단에서 두 사람을 어떻게 평가했는지 다시 읽어 보세요.
        review_item: "2-1"
        signals: [["누이가 옳", "통치자가 옳", "통치자가 잘못", "누이가 잘못", "국법이 우선", "가족이 우선"]]
        major: true
    done_message: 글쓴이의 판단을 찾고, 그 판단을 뒷받침하는 이유를 이어 썼어요.

  - id: l2_premise
    title: 숨은 연결 찾기
    prompt: 앞에서 쓴 이유에서 판단으로 넘어가려면, 글에 적혀 있지 않지만 꼭 필요한 생각이 하나 있어요. 그 생각을 한 문장으로 써 보세요.
    excerpts: [l2_ga]
    carry_from: [l2_initial]
    skip_if_met: true
    explanation: "숨은 연결은 ‘이유’와 ‘판단’ 사이의 빈칸을 메우는 생각이에요. 문맥에 맞고, 꼭 필요한 만큼만 말하고, 따져 볼 수 있는 문장이면 돼요. 너무 넓게 쓰면(예: ‘무엇이든 ~하면 언제나 옳다’) 글쓴이가 하지 않은 주장이 돼요."
    criteria:
      - id: h_link
        desc: 이유와 판단을 잇는 생각(자기 의무에 근거한 행동에는 정당한 이유가 있다 등)을 문맥에 맞게 썼다. 참고 문구와 달라도 인정
        evidence_for: [C2]
        skill: "2-3"
        signals: [["의무"], ["정당", "이유가 있", "옳다고 볼 수", "근거가 있", "잘못이라고만"]]
    errors:
      - id: e_too_strong
        name: 필요 이상으로 강한 보편 원리
        first_question: 그 연결 생각이 필요 이상으로 넓지는 않나요? 이 글의 문맥에서 꼭 필요한 만큼으로 좁혀 볼까요?
        review_item: "2-4"
        signals: [["언제나", "어떤 의무든", "무조건", "항상 옳"]]
      - id: e_no_link
        name: 연결 생각 누락
        first_question: 쓴 문장이 이유와 판단 사이의 빈칸을 메우나요? ‘이유가 맞다면 판단도 받아들여야 하는 까닭’을 생각해 보세요.
        review_item: "2-3"
    done_message: 숨은 연결을 찾았어요. 다만 이 연결이 옳다는 것까지 증명된 것은 아니라는 점도 기억해 두세요.

  - id: l2_function
    title: 설명과 논증 구별하기
    kind: judge
    prompt: 아래 문장이 이 글에서 하는 일을 고르고, 그렇게 본 이유를 쓰세요.
    excerpts: [l2_ga]
    sentence: "둘째 문단: ‘그녀는 가족을 묻어 주는 일은 어떤 통치자의 명령보다 앞서는 의무라고 믿었다.’"
    choices: ["누이의 행동을 이해시키는 설명", "누이의 행동이 옳다는 글쓴이의 논증", "설명과 논증을 함께 함"]
    explanation: "설명은 어떤 행동이나 현상이 ‘왜 일어났는지’ 이해시키는 것이고, 논증은 어떤 판단이 ‘왜 옳은지’ 정당화하는 것이에요. 한 문장이 둘을 함께 할 수도 있어서, 문장의 종류가 아니라 문맥에서 맡은 역할로 판단해요."
    criteria:
      - id: x_function
        desc: 인물의 믿음을 서술해 행동을 이해시키는 설명임을 알았다 (명칭보다 역할 설명으로 판단)
        evidence_for: [C2]
        skill: "2-5"
        expected_choice: 누이의 행동을 이해시키는 설명
        signals: [["믿", "행동", "까닭", "이유", "왜"]]
    errors:
      - id: e_belief_proof
        name: 믿음을 정당화로 혼동
        first_question: 인물이 그렇게 믿었다는 사실이 그 행동을 이해하게 해 주나요, 아니면 그 믿음이 옳다는 것까지 보여 주나요?
        review_item: "2-5"
        on_choice: 누이의 행동이 옳다는 글쓴이의 논증
    done_message: 행동을 이해시키는 설명과, 판단을 정당화하는 논증을 역할로 구별했어요.

  - id: l2_check
    title: 새 글로 혼자 확인하기
    prompt: 새 제시문 (나)에서 글쓴이의 판단 하나를 찾고, 그 판단을 뒷받침하는 이유를 연결해 쓰세요.
    excerpts: [l2_check]
    independent_check: true
    only_if_independent: true
    criteria:
      - id: ic_judgment
        desc: 글쓴이의 판단(스스로 사용 시간을 정하는 기회를 함께 마련해야 한다)을 찾았다
        evidence_for: [C2]
        skill: "2-1"
        signals: [["기회", "스스로", "함께 마련"]]
      - id: ic_reason
        desc: 이유(스스로 판단한 경험이 없으면 다시 빠진다)를 연결했다
        evidence_for: [C2]
        skill: "2-2"
        signals: [["경험", "다시", "판단해 본"], ["때문", "므로", "니까"]]
    errors:
      - id: e_summary
        name: 판단 없이 요약
        first_question: ""
    done_message: 새 글에서도 혼자 판단과 이유를 이어 썼어요.
