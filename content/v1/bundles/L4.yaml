# 제4학습 주제: 내 주장을 세우고 시험하기 (L4-001~L4-065)
id: L4
kind: topic
order: 4
title: 내 주장을 세우고 시험하기
goal: 논제에 대한 내 주장을 이유와 함께 세우고, 스스로 반론을 만들어 검토해요.
intro: "논제: 공적인 권한을 가진 사람에게 가족을 아끼는 마음과 공동체에 대한 책임이 부딪칠 때, 어떤 원칙이 필요한가? 글쓴이와 같은 결론일 필요는 없어요. 어떤 입장이든 이유가 타당하면 돼요."
time_target: 20~25분
next: L5
steps:
  - id: l4_claim
    title: 짧은 입론
    prompt: "논제에 대한 나의 주장(원칙)과 이유를 짧게 쓰고, 제시문의 어떤 내용이 그 주장을 왜 뒷받침하는지 설명하세요."
    excerpts: [l4_ga]
    evidence: true
    vocab:
      공적: 국가나 사회와 관계되는 것
      애착: 몹시 사랑하거나 끌려서 떨어지지 아니함
      사사롭다: 공적이 아닌 개인적인 범위의 것이다
    guide: 제시문을 요약하는 과제가 아니에요. ‘공적 권한을 가진 사람은 ~해야 한다’처럼 논제에 대한 내 원칙을 먼저 세우고, 왜 그 원칙이 필요한지 이유를 쓰고, 제시문의 어느 내용이 그 이유와 이어지는지 설명하면 돼요.
    explanation: "논증은 세 부분으로 이루어져요. 주장(논제에 대한 내 답), 근거(주장을 받쳐 주는 내용), 연결 이유(그 근거가 왜 주장을 뒷받침하는지). 근거를 인용만 하고 연결 이유를 쓰지 않으면, 읽는 사람은 그 근거가 왜 필요한지 알기 어려워요."
    criteria:
      - id: a_claim
        desc: 가족애와 공동체 책임의 관계에 답하는 자신의 주장(원칙)을 세웠다. 공감·제도·책임 등 어떤 측면을 강조해도 인정
        evidence_for: [C3]
        skill: "4-1"
        signals: [["원칙", "해야", "안 되", "필요", "말아야"], ["권한", "공적", "공동체", "가족", "공정"]]
      - id: a_link
        desc: 근거가 주장을 어떻게 지지하는지 연결 이유를 설명했다 (인용에 그치지 않음)
        evidence_for: [C3]
        skill: "4-3"
        signals: [["때문", "므로", "왜냐하면", "그래야", "니까"]]
      - id: a_evidence
        desc: 주장과 관련된 근거를 고르고 성격(제시문·규범적 이유·가상 사례)을 구별했다
        required: false
        skill: "4-2"
        signals: [["제시문", "글", "문단", "몫", "기회"]]
    errors:
      - id: e4_summary
        name: 요약만 함
        first_question: 제시문 내용을 잘 정리했어요. 그렇다면 논제에 대한 ‘나의 원칙’은 무엇인지 한 문장으로 써 볼까요?
        review_item: "4-1"
      - id: e4_means_only
        name: 제시문 수단 비판에만 머묾
        first_question: 제시문 주장의 문제를 잘 짚었어요. 그렇다면 논제가 묻는 ‘필요한 원칙’은 무엇이라고 생각하나요?
        review_item: "4-1"
        signals: [["지나치", "가족을 갖지 않", "말이 안 된"]]
      - id: e4_end_means
        name: 목적이 좋으니 수단도 옳다고 함
        first_question: 목적이 좋다는 것과, 그 목적을 이루는 방법이 정당하다는 것은 같은가요? 제시문이 말한 방법의 문제를 찾아보세요.
        review_item: "4-4"
        signals: [["사랑하니까 괜찮", "좋은 마음이니", "가족을 위한 거니까"]]
      - id: e4_corrupt
        name: 가족애를 곧바로 부패로 봄
        first_question: 가족을 아끼는 감정과, 그 감정으로 권한을 행사하는 것은 같은 일인가요?
        review_item: "4-4"
        signals: [["가족애는 부패", "가족을 아끼는 것은 잘못", "가족애 자체가"]]
      - id: e4_fact
        name: 확인되지 않은 외부 사실
        first_question: 그 내용은 확인된 사실인가요, 가정인가요? 가정이라면 가정이라고 밝히거나 다른 근거로 바꿔 볼까요?
        review_item: "4-2"
        signals: [["반드시 떨어", "통계적으로", "무조건 망", "100%"]]
      - id: e4_repeat
        name: 주장만 반복
        first_question: 주장은 분명해요. 그 주장을 받아들여야 하는 별도의 이유를 하나 찾아 이어 써 볼까요?
        review_item: "4-3"
        signals: [["해야 하기 때문", "필요하기 때문", "옳기 때문"]]
    done_message: 논제에 답하는 내 원칙을 세우고, 근거가 그 원칙을 어떻게 뒷받침하는지 설명했어요.

  - id: l4_counter
    title: 내가 먼저 만드는 반론
    prompt: 이제 내 주장에 반대하는 사람이 제기할 수 있는 중요한 문제를 하나 쓰고, 그 문제가 내 주장에 어떤 어려움을 주는지 설명하세요.
    excerpts: [l4_ga]
    carry_from: [l4_claim]
    guide: "검토 방향만 알려 줄게요. 세 가지 중 하나를 살펴보세요. ① 내 주장이 성립하지 않는 경우 ② 내 주장을 따를 때 생길 수 있는 뜻하지 않은 부작용 ③ 실제로 실행하기 어려운 조건"
    explanation: "반론은 단순히 ‘나는 반대야’가 아니라, 내 주장이나 그 근거·전제의 문제를 짚는 것이에요. 반례는 주장이 맞지 않는 구체적인 경우예요. ‘모든 경우’를 말하는 주장은 적절한 반례 하나로 흔들릴 수 있지만, ‘대체로’를 말하는 주장은 그렇지 않아요."
    demo:
      excerpt: l4_demo
      text: "다른 주장으로 시범을 보일게요. 주장 ‘학급 회의는 다수결로만 정해야 한다’에 대한 반론은 ‘다수결로만 정하면 소수 학생이 늘 손해를 보는 결정이 반복될 수 있다’예요. 이 반론은 주장의 ‘언제나 공정하다’는 부분을 겨냥해요. 이제 내 주장에 대한 반론은 직접 써 보세요."
    criteria:
      - id: b_counter
        desc: 자기 주장이나 근거·전제의 문제(실행 조건·부작용·충분성)를 제기했다. 단순 반대 의견은 불인정
        evidence_for: [C4]
        skill: "4-5"
        signals: [["하지만", "그러나", "문제", "어렵", "부작용", "경우", "못할", "수 없"]]
      - id: b_target
        desc: 반론이 실제 내 주장을 겨냥한다
        required: false
        skill: "4-6"
        signals: [["원칙", "주장", "가족", "권한"]]
    errors:
      - id: e4_no_reason
        name: 입장만 있고 공격 지점 없음
        first_question: 반대 입장은 나왔어요. 그 입장이 내 주장의 어떤 점을 문제 삼는지, 이유를 직접 써 볼까요?
        review_item: "4-5"
      - id: e4_wrong_target
        name: 다른 주장을 겨냥
        first_question: 그 반론은 내 주장을 겨냥하나요, 제시문의 다른 주장을 겨냥하나요? 내가 처음 쓴 주장을 다시 확인해 보세요.
        review_item: "4-6"
        signals: [["옛 사상가", "가족을 갖지"]]
    done_message: 내 주장을 실제로 겨냥하는 반론을 스스로 만들었어요.

  - id: l4_response
    title: 반론에 대응하기
    prompt: 그 반론에 대해 내 주장을 유지할지, 범위를 제한할지, 수정할지 정하고 그 이유를 쓰세요.
    excerpts: [l4_ga]
    carry_from: [l4_claim, l4_counter]
    criteria:
      - id: c_response
        desc: 유지·제한·수정·철회 중 하나를 밝혔다 (입장 변경 자체를 높게 평가하지 않음)
        evidence_for: [C4]
        skill: "4-7"
        signals: [["유지", "제한", "수정", "바꾸", "줄이", "철회", "그래도", "다만", "보완"]]
      - id: c_reason
        desc: 대응의 이유(반론이 원칙을 무너뜨리지 않는 이유나 보완 조건)를 밝혔다
        evidence_for: [C4]
        skill: "4-7"
        signals: [["때문", "므로", "왜냐하면", "이유", "니까", "그래야"]]
    errors:
      - id: e4_resp_no_reason
        name: 대응 이유 부재
        first_question: 어떻게 대응할지는 정했어요. 왜 그렇게 대응하는지 이유를 덧붙여 볼까요?
        review_item: "4-7"
      - id: e4_give_up
        name: 반론 후 전면 포기
        first_question: 반론에서 인정할 부분과, 그래도 남는 내 주장을 나누어 볼까요?
        review_item: "4-7"
        signals: [["포기", "내 주장은 틀렸", "내 주장이 잘못"]]
      - id: e4_reject
        name: 반론을 무조건 거부
        first_question: 그 반론의 어느 부분이 틀렸는지 설명해 볼까요?
        review_item: "4-6"
        signals: [["말이 안", "틀린 반론", "신경 쓸 필요"]]
    done_message: 반론을 검토하고, 내 주장을 어떻게 다룰지 이유와 함께 정했어요.

  - id: l4_final
    title: 최종 입장 정리
    prompt: 처음 주장과 반론 검토를 반영해, 최종 입장과 보완한 이유를 짧게 정리하세요.
    excerpts: [l4_ga]
    carry_from: [l4_claim, l4_counter, l4_response]
    criteria:
      - id: f_final
        desc: 반론 검토를 반영한 최종 입장을 밝혔다
        evidence_for: [C3]
        skill: "4-7"
        signals: [["원칙", "해야", "필요", "안 되", "말아야"]]
      - id: f_reason
        desc: 보완한 이유를 밝혔다
        evidence_for: [C3]
        skill: "4-7"
        signals: [["때문", "므로", "반론", "보완", "조건", "다만"]]
    errors:
      - id: e4_final
        name: 검토 반영 누락
        first_question: 반론을 검토한 결과가 최종 입장에 어떻게 반영되었나요? 유지한 부분과 보완한 부분을 나누어 써 보세요.
        review_item: "4-7"
    done_message: 반론 검토를 반영해 내 최종 입장과 이유를 정리했어요.
