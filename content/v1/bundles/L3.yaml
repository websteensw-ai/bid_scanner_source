# 제3학습 주제: 1차·2차 활동 (두 글 비교와 추론 점검) (L3-001~L3-079)
# 관계·추론 기능은 별도 진입 관문이 아니라 기능 프로필로 기록한다 (Z-031·S3-001).
# 그래서 이 묶음의 기준은 evidence_for 를 비워 두고, 단계별 수준과 복습 항목으로만 남긴다.
id: L3
kind: topic
order: 3
title: 두 글 비교와 추론 점검
goal: 두 글을 같은 질문으로 비교하고, 결론이 원문의 조건과 범위를 지키는지 점검해요.
intro: 1차 활동에서는 (가)·(나)를, 2차 활동에서는 새 글 (다)·(라)를 읽어요. 두 활동 사이에 저장하고 쉬었다 와도 괜찮아요.
time_target: 40~50분 (1차 20~25분, 2차 20~25분)
next: L4
steps:
  # ---------------- 1차 활동 ----------------
  - id: l3_compare
    title: "1차 · 두 글이 함께 답하는 질문"
    prompt: (가)와 (나)가 함께 답할 수 있는 질문을 하나 만들고, 두 글의 공통점과 강조점의 차이를 설명하세요. 근거가 된 부분도 적어 주세요.
    excerpts: [l3_ga, l3_na]
    evidence: true
    vocab:
      방종: 거리낌 없이 제멋대로 행동함
      제정: 법이나 제도를 만들어 정함
      절차: 일을 해 나가는 순서와 방법
    guide: ‘둘 다 법 이야기다’처럼 공통 소재를 말하는 것이 아니라, 두 글이 각각 나름의 답을 내놓는 ‘질문’을 만드는 과제예요. 그다음 같은 기준으로 두 글을 비교해요.
    structure: "빈 비교표를 채워 보고, 그 내용을 비교 문장에 그대로 써도 돼요.\n| | (가) | (나) |\n|---|---|---|\n| 경계하는 것 | | |\n| 중요한 기준 | | |\n| 그 이유 | | |"
    explanation: "공통 소재는 ‘두 글이 무엇에 관해 말하는가’이고, 공통 질문은 ‘두 글이 각자 답을 내놓는 물음’이에요. 예를 들어 ‘급식’은 소재이고, ‘급식 순서는 무엇을 기준으로 정해야 하는가?’는 질문이에요. 좋은 비교는 같은 기준(예: 무엇을 경계하는가)으로 두 글을 나란히 놓아요."
    criteria:
      - id: q_common
        desc: 두 글 본문 모두에서 답을 찾을 수 있는 공통 질문을 세웠다 (다른 타당한 질문 인정)
        skill: "3-1"
        signals: [["자유", "질서", "판단", "법", "공동체"], ["?", "무엇", "어떻게", "어떤", "누가", "왜"]]
      - id: q_diff
        desc: 같은 기준으로 강조점의 차이를 상대적으로 설명했다 (억지 대립 아님)
        skill: "3-3"
        signals: [["(가)", "가는", "가)"], ["(나)", "나는", "나)"]]
      - id: q_condition
        desc: 원문의 조건(올바르게 제정된 법, 법이 정한 절차)을 보존했다
        required: false
        skill: "3-4"
        signals: [["올바르게", "절차"]]
    errors:
      - id: e3_topic
        name: 공통 소재에 머묾
        first_question: ‘무엇에 관한 글인가’는 잘 잡았어요. 그 소재에 대해 두 글이 각자 답을 내놓는 질문으로 바꿔 볼까요?
        review_item: "3-1"
      - id: e3_opposed
        name: 반대 오인
        first_question: 두 글이 정말 서로 반대 주장을 하나요? 각 글이 무엇을 경계하는지 같은 기준으로 비교해 보세요.
        review_item: "3-7"
        signals: [["반대", "대립", "정반대"]]
      - id: e3_exaggerate
        name: 범위 과장
        first_question: 한 글이 한 가지‘만’ 다룬다고 범위를 넓힌 부분은 없나요? 한 문제씩 원문과 확인해 보세요.
        review_item: "3-5"
        signals: [["만 다룬", "만 말한", "오직", "전혀 다루지"]]
      - id: e3_separate
        name: 따로 요약
        first_question: 두 글을 각각 잘 요약했어요. 이제 두 글을 같은 기준 하나로 나란히 놓으면 무엇이 같고 무엇이 다른가요?
        review_item: "3-2"
        signals: [["(가)는", "(가)에서는"], ["(나)는", "(나)에서는"]]
    done_message: 두 글이 함께 답하는 질문을 세우고, 같은 기준으로 강조점의 차이를 설명했어요.

  - id: l3_condition
    title: "1차 · 조건이 빠진 해석 문장 점검"
    kind: judge
    prompt: 아래 학습용 해석 문장이 (가)에 비추어 뒷받침되는지 고르고, 이유를 쓰세요. 필요하면 원문 수준으로 고쳐 쓰세요.
    excerpts: [l3_ga]
    sentence: "(가)에 따르면, 법은 따를수록 자유가 커진다."
    choices: [타당함, 조건부로 타당함, 뒷받침되지 않음]
    explanation: "원문이 붙인 조건이 해석 문장에서 빠지면, 결론이 원문보다 넓어져요. 원문이 말한 것, 내가 덧붙여 추론한 것, 원문만으로는 확인할 수 없는 것을 나누어 보세요."
    demo:
      excerpt: l3_demo
      text: "다른 예로 시범을 보일게요. 원문은 ‘정기 점검을 통과한 놀이 기구는 안전하게 이용할 수 있다’인데, 해석 문장은 ‘놀이 기구는 안전하게 이용할 수 있다’예요. 조건 ‘정기 점검을 통과한’이 빠져서 결론이 넓어졌어요. 이제 (가)와 해석 문장을 비교해 빠진 조건을 직접 찾아보세요."
    criteria:
      - id: k_condition
        desc: 원문의 조건(올바르게 제정된 법)이 빠졌음을 짚고 결론 범위를 원문 수준으로 고쳤다. 조건의 완전한 정의는 요구하지 않음
        skill: "3-4"
        signals: [["올바르게", "제정", "조건", "어떤 법"]]
      - id: k_choice
        desc: 조건부로 타당함 (이유가 조건 누락을 짚으면 ‘뒷받침되지 않음’도 인정)
        required: false
        expected_choice: 조건부로 타당함
    errors:
      - id: e3_cond_missing
        name: 조건 누락
        first_question: 원문 (가)는 어떤 법을 따르라고 했나요? 해석 문장과 원문을 나란히 놓고 빠진 말이 있는지 찾아보세요.
        review_item: "3-4"
      - id: e3_cond_accept
        name: 조건 없는 해석 수용
        first_question: 해석 문장을 그대로 받아들이면, 원문보다 넓은 내용까지 말하게 되지 않나요? 원문 둘째 문단을 다시 읽어 보세요.
        review_item: "3-4"
        on_choice: 타당함
    done_message: 해석 문장에서 빠진 원문의 조건을 찾아 결론 범위를 바로잡았어요.

  # ---------------- 2차 활동 ----------------
  - id: l3_transfer
    title: "2차 · 새 두 글 비교 (혼자 확인)"
    prompt: 새 글 (다)와 (라)가 함께 답하는 질문 하나와, 두 글이 설명하는 방식의 차이를 쓰세요. 근거가 된 부분도 적어 주세요.
    excerpts: [l3_da, l3_ra]
    evidence: true
    independent_check: true
    vocab:
      청렴: 성품과 행실이 맑고 재물 욕심이 없음
      공금: 여러 사람을 위해 쓰도록 모은 돈
    criteria:
      - id: t_common
        desc: 두 글이 함께 답하는 질문(공직자의 부정을 어떻게 막을 수 있는가 등)을 세웠다
        skill: "3-1"
        signals: [["부정", "청렴", "공직", "권한"], ["?", "무엇", "어떻게", "어떤", "왜"]]
      - id: t_diff
        desc: (다)는 일반 원인·제도를, (라)는 구체 사례·개인을 보여 준다는 설명 방식의 차이를 짚었다
        skill: "3-8"
        signals: [["제도", "일반", "원인", "공개"], ["사례", "지도자", "개인", "검소", "한 사람"]]
      - id: r_general
        desc: (일반과 사례) 두 글의 관계를 일반-사례로 설명했다
        required: false
        signals: [["사례", "예"], ["일반", "원인", "제도"]]
    errors:
      - id: e3_topic
        name: 공통 소재에 머묾
        first_question: ""
    done_message: 새 두 글에도 1차에서 익힌 비교 방법을 혼자 적용했어요.

  - id: l3_general_case
    title: "2차 · 일반과 사례의 관계"
    prompt: (다)는 일반적인 원인과 대책을 말해요. 그렇다면 (라)는 무엇을 보여 주나요? 두 글의 관계를 설명해 보세요.
    excerpts: [l3_da, l3_ra]
    skip_if_met: true
    criteria:
      - id: r_general
        desc: 두 글의 관계를 일반 원리와 구체 사례의 관계로 설명했다
        skill: "3-8"
        signals: [["사례", "예", "한 사람", "지도자"], ["일반", "원인", "제도", "대책"]]
    errors:
      - id: e3_relation
        name: 관계 미설명
        first_question: (라)의 지도자 이야기는 (다)가 말한 일반적인 내용과 어떤 점에서 이어지나요?
        review_item: "3-8"
    done_message: 일반 원리와 구체 사례의 관계를 설명했어요.

  - id: l3_complement
    title: "2차 · 대립인가 보완인가"
    kind: judge
    prompt: 아래 질문에 답을 고르고, 그 이유를 쓰세요.
    excerpts: [l3_da, l3_ra]
    sentence: "(다)의 제도적 대책과 (라)가 보여 주는 개인의 청렴은 서로 대립하는가, 보완하는가?"
    choices: [대립, 보완, 판단할 수 없음]
    criteria:
      - id: p_complement
        desc: 함께 시행할 수 있으므로 보완 관계임을 설명했다 (명칭이 아니라 설명 내용으로 판단, 실제 효과 입증은 요구하지 않음)
        skill: "3-7"
        expected_choice: 보완
        signals: [["함께", "같이", "둘 다", "병행", "동시에"]]
    errors:
      - id: e3_means_opposed
        name: 다른 수단을 대립으로 봄
        first_question: 다른 수단을 제안한다고 해서 꼭 상대를 부정하는 걸까요? 두 대책을 함께 쓸 수 있는지 생각해 보세요.
        review_item: "3-7"
        on_choice: 대립
    done_message: 두 글의 대책이 함께 쓰일 수 있는 보완 관계임을 설명했어요.

  - id: l3_induction
    title: "2차 · 추론 점검 ① 사례에서 일반으로"
    kind: judge
    prompt: 아래 학습용 해석 문장이 두 글로 뒷받침되는지 고르고, 이유를 쓰세요. 필요하면 고쳐 쓰세요.
    excerpts: [l3_ra]
    sentence: "(라)의 지도자가 청렴했으므로, 모든 공직자는 어떤 상황에서도 스스로 청렴할 수 있다."
    choices: [타당함, 조건부로 타당함, 뒷받침되지 않음]
    criteria:
      - id: i_scope
        desc: 한 사례로 모든 대상·상황을 결론 내린 범위 초과를 짚었다 (‘모든’ 삭제만이 아니라 근거의 범위를 설명)
        skill: "3-9"
        expected_choice: 뒷받침되지 않음
        signals: [["한 사람", "한 사례", "하나", "한 명", "범위", "모든"]]
    errors:
      - id: e3_induction
        name: 사례 범위 초과 수용
        first_question: 한 사람의 사례가 ‘모든 공직자, 어떤 상황에서도’까지 보여 주나요? 사례가 허용하는 범위로 고쳐 보세요.
        review_item: "3-9"
        on_choice: 타당함
    done_message: 사례가 보여 주는 것과 일반 결론이 요구하는 것을 구별했어요.

  - id: l3_deduction
    title: "2차 · 추론 점검 ② 전제에서 결론으로"
    kind: judge
    prompt: 아래 학습용 해석 문장에서, 전제를 받아들이면 결론이 반드시 따라오는지 판단하고 이유를 쓰세요.
    excerpts: [l3_da]
    sentence: "(다)에 따르면 권한이 몰리면 부정이 생기기 쉽다. 이 도시는 권한을 나누었으므로 부정이 생기지 않는다."
    choices: [타당함, 조건부로 타당함, 뒷받침되지 않음]
    criteria:
      - id: d_direction
        desc: 방향을 뒤집은 결론은 따르지 않음을 짚었다 (전제의 참과 추론 형식의 타당성 구분)
        skill: "3-10"
        expected_choice: 뒷받침되지 않음
        signals: [["반드시", "따르지", "뒤집", "나누었다고", "않는다고", "보장", "생길 수"]]
    errors:
      - id: e3_deduction
        name: 방향 뒤집기 수용
        first_question: ‘권한이 몰리면 부정이 쉽다’를 받아들이면, ‘권한을 나누면 부정이 없다’도 반드시 따라 나오나요?
        review_item: "3-10"
        on_choice: 타당함
    done_message: 전제를 받아들여도 뒤집은 결론은 따라 나오지 않는다는 점을 확인했어요.

  - id: l3_cause
    title: "2차 · 추론 점검 ③ 원인과 결과"
    kind: judge
    prompt: 아래 학습용 해석 문장이 (라)로 뒷받침되는지 고르고, 이유를 쓰세요. 필요하면 확인된 내용과 더 확인할 내용을 나누어 고쳐 쓰세요.
    excerpts: [l3_ra]
    sentence: "(라)의 지도자가 청렴했던 원인은 검소한 생활 방식이다."
    choices: [타당함, 조건부로 타당함, 뒷받침되지 않음]
    criteria:
      - id: c_cause
        desc: 함께 서술된 특징을 원인으로 확정할 수 없음을 짚었다 (‘원인 미확정’과 ‘원인 아님’을 구별)
        skill: "3-11"
        expected_choice: 뒷받침되지 않음
        signals: [["함께", "원인", "확인", "알 수 없", "확정", "단정"]]
    errors:
      - id: e3_cause
        name: 함께 나타난 것을 원인으로 단정
        first_question: (라)는 검소한 생활과 청렴을 함께 서술했나요, 아니면 하나가 다른 하나의 원인이라고 말했나요?
        review_item: "3-11"
        on_choice: 타당함
    done_message: 함께 나타난 사실과 원인을 구별했어요.

  - id: l3_analogy
    title: "2차 · 추론 점검 ④ 비슷한 경우에 적용하기"
    kind: judge
    prompt: 아래 학습용 해석 문장이 타당한지 고르고, 비슷한 점과 중요한 차이를 들어 이유를 쓰세요.
    excerpts: [l3_ra]
    sentence: "학생회도 공동의 돈을 다루므로, (라)의 지도자처럼 돈의 쓰임을 공개하면 신뢰를 얻는 데 도움이 될 수 있다."
    choices: [타당함, 조건부로 타당함, 뒷받침되지 않음]
    criteria:
      - id: a_similar
        desc: 결론과 관련된 유사성(공동의 돈 관리)을 짚었다. 합리적 확장으로 인정하되 원문의 내용으로 귀속하지 않음
        skill: "3-12"
        signals: [["공동", "돈", "자금", "비슷", "같"]]
      - id: a_choice
