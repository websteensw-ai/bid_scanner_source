# 복습 항목 (L1-027·L2-030·L3-028·L4-054·L5-065). 새 필수 차시가 아니라 선택 복습용 콘텐츠 단위.
# 열람 시 설명과 별도 사례 시범을 먼저 주고, 현재 제시문의 완성 답안은 공개하지 않는다 (L1-028).
- id: 1-1
  topic: L1
  name: 소재와 중심 생각 구별
  skill: 소재와 중심 판단을 구별한다
  explanation: 소재는 ‘무엇에 관한 글인가’, 중심 생각은 ‘그 대상에 대해 글쓴이가 무엇이라고 말하는가’예요.
  demo: ‘우리 반 청소’는 소재, ‘청소 구역을 돌아가며 맡으면 불만이 줄어든다’는 중심 생각이에요.
  practice: 최근에 읽은 글 하나를 떠올려 소재와 중심 생각을 한 줄씩 써 보세요.
- id: 1-2
  topic: L1
  name: 핵심어를 관계로 연결
  skill: 핵심어를 나열하지 않고 관계로 잇는다
  explanation: 핵심어를 나열하는 것보다, 핵심어들이 어떻게 이어지는지(기준·원인·대조)를 한 문장에 담는 것이 중요해요.
  demo: ‘연습’, ‘실력’ → ‘꾸준한 연습이 실력을 만든다’처럼 관계를 문장으로 이어요.
  practice: ‘규칙’, ‘이유’, ‘지키다’ 세 낱말을 관계가 드러나게 한 문장으로 이어 보세요.
- id: 1-3
  topic: L1
  name: 글쓴이 생각과 내 의견 구별
  skill: 필자의 판단과 자신의 동의 여부를 구별한다
  explanation: 글쓴이의 생각을 정확히 옮기는 것과, 내가 그 생각에 동의하는지는 따로 다뤄요.
  demo: ‘글쓴이는 A라고 본다. 나는 B 때문에 일부만 동의한다.’처럼 두 문장으로 나누어요.
  practice: 동의하지 않는 글 하나를 떠올려, 글쓴이 생각과 내 의견을 나누어 써 보세요.
- id: 1-4
  topic: L1
  name: 원문 근거로 확인
  skill: 판단의 근거를 원문 표현에서 찾는다
  explanation: 내 해석이 맞는지는 원문의 구체적 표현으로 확인해요. 제목이나 배경지식이 아니라 제시된 문단 안에서 찾아요.
  demo: ‘이 문단의 “미리 알렸다”는 표현이 기준이 공개되었다는 근거다’처럼 표현을 짚어요.
  practice: 내 해석 한 문장과 그것을 뒷받침하는 원문 표현 하나를 짝지어 보세요.
- id: 1-5
  topic: L1
  name: 사례를 일반 문장으로
  skill: 특정 사례를 넘어서는 일반 문장으로 바꾼다
  explanation: 사례를 일반 문장으로 바꿀 때는 원래의 관계를 유지하면서 특정 인물·장소 이야기에서 벗어나요.
  demo: ‘철수는 매일 연습해서 대회에서 이겼다’ → ‘꾸준한 연습은 성과를 내는 데 도움이 된다’.
  practice: 짧은 사례 하나를 골라 관계를 유지한 일반 문장으로 바꿔 보세요.
- id: 1-6
  topic: L1
  name: 일반화의 조건과 범위
  skill: 일반화가 원문이 다룬 범위를 넘지 않게 한다
  explanation: ‘적용해 볼 수 있다’와 ‘모든 경우에 반드시 그렇다’는 달라요. 표현의 세기보다 대상 범위가 중요해요.
  demo: ‘모든 운동선수는 연습만 하면 이긴다’는 범위를 넘은 문장이에요.
  practice: 범위를 넘은 문장 하나를 원문 범위에 맞게 고쳐 보세요.
- id: 2-1
  topic: L2
  name: 판단과 이유 구별
  skill: 판단과 그 이유를 구별한다
  explanation: 판단은 ‘무엇이 옳다/~해야 한다’, 이유는 ‘왜 그 판단을 받아들여야 하는가’예요. 판단을 반복한 문장은 이유가 아니에요.
  demo: ‘숙제는 해야 한다. 숙제는 중요하기 때문이다.’는 반복이고, ‘배운 것을 혼자 확인할 수 있기 때문이다’가 이유예요.
  practice: 판단 하나를 정하고, 반복이 아닌 이유를 하나 써 보세요.
- id: 2-2
  topic: L2
  name: 판단과 이유 연결
  skill: 이유가 판단을 뒷받침하도록 연결한다
  explanation: 이유를 찾았다면 그 이유가 판단을 어떻게 뒷받침하는지 이어 써요. 사건의 결과는 이유와 다를 수 있어요.
  demo: ‘벌을 받았으니 잘못이다’는 결과를 이유로 쓴 것이에요.
  practice: 결과가 아닌 이유로 판단을 뒷받침하는 문장을 써 보세요.
- id: 2-3
  topic: L2
  name: 숨은 연결 찾기
  skill: 이유와 판단 사이의 생략된 생각을 재구성한다
  explanation: 글에 적혀 있지 않지만 이유에서 판단으로 넘어가려면 필요한 생각이 있어요. 그것이 숨은 연결이에요.
  demo: ‘비가 온다. 그러니 우산을 챙겨야 한다.’의 숨은 연결은 ‘비를 맞지 않는 것이 좋다’예요.
  practice: 판단과 이유가 있는 짧은 문장에서 숨은 연결을 찾아 써 보세요.
- id: 2-4
  topic: L2
  name: 숨은 연결의 범위
  skill: 숨은 연결을 문맥에 맞는 최소 범위로 쓴다
  explanation: 숨은 연결을 너무 넓게 쓰면 글쓴이가 하지 않은 주장이 돼요. 꼭 필요한 만큼만 써요. 찾았다고 옳다는 것이 증명되지는 않아요.
  demo: ‘어떤 규칙이든 언제나 지켜야 한다’는 너무 넓고, ‘이 규칙은 다른 사람의 손해를 막는다’는 알맞아요.
  practice: 너무 넓은 연결 문장 하나를 좁혀 보세요.
- id: 2-5
  topic: L2
  name: 설명과 논증 구별
  skill: 설명과 정당화를 역할로 구별한다
  explanation: 설명은 ‘왜 일어났는지’ 이해시키고, 논증은 ‘왜 옳은지’ 정당화해요. 한 문장이 둘을 함께 할 수도 있어요.
  demo: ‘그는 늦잠을 자서 지각했다’는 설명, ‘지각을 줄이려면 알람을 두 개 맞춰야 한다’는 논증이에요.
  practice: 설명 문장 하나와 논증 문장 하나를 직접 만들어 보세요.
- id: 2-6
  topic: L2
  name: 누구의 생각인지 구별
  skill: 인물·통념의 입장과 필자의 판단을 구별한다
  explanation: 글에 나온 생각이 모두 글쓴이의 생각은 아니에요. 인물이나 ‘어떤 사람들’의 생각과 글쓴이의 평가를 나누어 읽어요.
  demo: ‘어떤 사람들은 A라고 말한다. 하지만 B다.’에서 글쓴이의 생각은 B예요.
  practice: ‘~라고 말하는 사람도 있다’가 들어간 문장을 만들어 주체를 구별해 보세요.
- id: 3-1
  topic: L3
  name: 공통 질문 세우기
  skill: 두 글이 함께 답하는 질문을 세운다
  explanation: 공통 소재가 아니라, 두 글이 각자 답을 내놓는 질문을 세워요.
  demo: ‘급식’은 소재, ‘급식 순서는 무엇을 기준으로 정해야 하는가?’는 질문이에요.
  practice: 두 의견을 떠올려, 둘이 함께 답할 질문을 하나 만들어 보세요.
- id: 3-2
  topic: L3
  name: 같은 기준으로 비교
  skill: 같은 기준으로 두 글을 나란히 비교한다
  explanation: 두 글을 따로 요약하지 말고, ‘무엇을 경계하는가’ 같은 하나의 기준으로 나란히 놓아요.
  demo: '기준: 무엇을 걱정하는가 → A는 혼란, B는 독단.'
  practice: 두 의견을 하나의 기준으로 비교하는 문장을 써 보세요.
- id: 3-3
  topic: L3
  name: 강조점 차이 설명
  skill: 상대적 강조점의 차이를 설명한다
  explanation: 두 글이 꼭 반대일 필요는 없어요. 어디에 더 무게를 두는지 상대적으로 설명해요.
  demo: ‘A는 자유를 지키는 조건을, B는 판단의 한계를 더 강조한다.’
  practice: ‘~만 다룬다’ 대신 ‘~를 더 강조한다’로 바꿔 보세요.
- id: 3-4
  topic: L3
  name: 조건 보존
  skill: 원문의 조건을 결론에 남긴다
  explanation: 원문이 붙인 조건이 결론에서 빠지면 원문보다 넓은 주장이 돼요.
  demo: ‘점검을 통과한 기구는 안전하다’ → ‘기구는 안전하다’는 조건 누락이에요.
  practice: 조건이 있는 문장 하나를 조건을 살려 요약해 보세요.
- id: 3-5
  topic: L3
  name: 결론 범위 점검
  skill: 결론이 원문의 범위를 지키는지 점검한다
  explanation: 결론이 원문이 말한 범위를 넘지 않는지 한 문제씩 확인해요.
  demo: ‘(가)는 자유만 다룬다’는 범위를 과장한 표현이에요.
  practice: 범위를 과장한 문장 하나를 원문에 맞게 고쳐 보세요.
- id: 3-6
  topic: L3
  name: 원문·추론·확인 불가 구분
  skill: 원문이 말한 것, 추론한 것, 확인할 수 없는 것을 구분한다
  explanation: 읽을 때 ‘원문이 말한 것’, ‘내가 덧붙여 추론한 것’, ‘원문만으로는 확인할 수 없는 것’을 나누어요.
  demo: ‘그는 검소했다’(원문) / ‘그래서 청렴했을 것이다’(추론) / ‘검소함이 원인이다’(확인 불가).
  practice: 읽은 글에서 세 가지를 하나씩 찾아 나누어 써 보세요.
- id: 3-7
  topic: L3
  name: 대립과 보완
  skill: 두 주장이 대립인지 보완인지 판단한다
  explanation: 함께 시행할 수 있는 주장은 보완, 상대를 부정하는 주장은 대립이에요. 다른 수단을 제안한다고 곧 대립은 아니에요.
  demo: ‘벌을 강화하자’와 ‘교육을 늘리자’는 함께 할 수 있으니 보완이에요.
  practice: 두 대책을 떠올려 대립인지 보완인지 이유와 함께 써 보세요.
- id: 3-8
  topic: L3
  name: 일반 원리와 사례
  skill: 일반 원리와 구체 사례의 관계를 설명한다
  explanation: 한 글은 일반 원리를, 다른 글은 그 원리를 보여 주는 사례를 말할 수 있어요.
  demo: ‘연습이 실력을 만든다’(일반) / ‘그는 매일 연습해 우승했다’(사례).
  practice: 일반 문장 하나에 어울리는 사례를 하나 붙여 보세요.
- id: 3-9
  topic: L3
  name: 일반화 범위
  skill: 사례가 허용하는 범위로 결론을 내린다
  explanation: 한 사례는 가능성을 보여 줄 수 있지만, 모든 경우를 입증하지는 않아요. ‘모든’을 지우는 것보다 근거의 범위를 확인해요.
  demo: ‘한 학생이 혼자 공부해 합격했다 → 모든 학생은 혼자 공부해야 한다’는 범위 초과예요.
  practice: 범위를 넘은 결론 하나를 사례에 맞게 고쳐 보세요.
- id: 3-10
  topic: L3
  name: 전제와 적용 조건
  skill: 전제에서 결론이 반드시 따라오는지 확인한다
  explanation: 전제를 받아들일 때 결론이 반드시 따라오는지 확인해요. 방향을 뒤집은 결론은 따라오지 않아요.
  demo: ‘비가 오면 땅이 젖는다’에서 ‘땅이 젖었으니 비가 왔다’는 반드시 따라오지 않아요.
  practice: ‘A이면 B다’ 문장 하나를 만들고, 뒤집은 결론이 따라오는지 확인해 보세요.
- id: 3-11
  topic: L3
  name: 원인과 결과의 근거
  skill: 함께 나타난 것과 원인을 구별한다
  explanation: 두 가지가 함께 나타났다고 하나가 다른 하나의 원인이라고 확정할 수 없어요. ‘원인 미확정’과 ‘원인 아님’도 달라요.
  demo: ‘아이스크림 판매가 늘 때 물놀이 사고도 늘었다’ → 판매가 사고의 원인이라고 할 수 없어요.
  practice: 함께 나타난 두 현상을 떠올려, 원인으로 확정할 수 있는지 따져 보세요.
- id: 3-12
  topic: L3
  name: 유사성의 적용
  skill: 결론과 관련된 유사성과 중요한 차이를 구별한다
  explanation: 비슷한 경우에 적용할 때는 결론과 관련된 비슷한 점과 중요한 차이를 함께 봐요.
  demo: ‘학교 텃밭도 공동 관리가 필요하다’는 공동 자원이라는 유사성을, 규모 차이와 함께 따져요.
  practice: 한 사례를 다른 상황에 적용하며 비슷한 점과 차이를 하나씩 써 보세요.
- id: 4-1
  topic: L4
  name: 논제에 답하는 주장
  skill: 논제에 답하는 자신의 주장을 세운다
  explanation: 논제가 묻는 것에 답하는 ‘나의 판단’을 먼저 세워요. 글 내용 소개와 달라요.
  demo: 논제 ‘방과 후 활동은 의무여야 하는가?’ → ‘원하는 활동을 고를 수 있다면 의무여도 좋다.’
  practice: 익숙한 논제 하나에 대한 내 주장을 한 문장으로 써 보세요.
- id: 4-2
  topic: L4
  name: 근거 고르기
  skill: 주장과 관련된 근거를 고르고 성격을 구별한다
  explanation: 근거는 제시문 내용, 규범적 이유, 가상 사례, 실제 자료 등으로 나뉘어요. 확인되지 않은 사실은 가정으로 밝혀요.
  demo: ‘공정해야 한다는 원칙’(규범적 이유) / ‘한 반에서 그랬다고 가정하면’(가상 사례).
  practice: 내 주장에 근거 두 개를 붙이고 각각의 성격을 적어 보세요.
- id: 4-3
  topic: L4
  name: 근거와 주장의 연결
  skill: 근거가 주장을 왜 뒷받침하는지 설명한다
  explanation: 근거를 인용만 하지 말고, 그것이 왜 주장을 뒷받침하는지 한 문장으로 설명해요.
  demo: ‘기회가 줄어든다(근거) → 그래서 권한을 쓸 때 공정한 기준이 필요하다(연결)’.
  practice: 근거 하나와 연결 이유 한 문장을 짝지어 써 보세요.
- id: 4-4
  topic: L4
  name: 목적과 수단 구분
  skill: 목적에 대한 동의와 수단의 타당성을 구분한다
  explanation: 목적이 좋다고 해서 그 목적을 이루는 방법까지 옳은 것은 아니에요.
  demo: ‘공부를 잘하게 하려고(목적) 잠을 못 자게 한다(수단)’는 수단이 문제예요.
  practice: 좋은 목적과 문제 있는 수단의 예를 하나 만들어 보세요.
- id: 4-5
  topic: L4
  name: 실질적 반론 만들기
  skill: 자기 주장의 문제를 제기하는 반론을 만든다
  explanation: 반론은 반대 결론이 아니라, 주장의 실행 조건·부작용·충분성을 겨냥해요.
  demo: '‘숙제를 없애자’ → 반론: ‘혼자 복습할 기회가 사라질 수 있다.’'
  practice: 내 주장 하나에 대한 실질적 반론을 써 보세요.
- id: 4-6
  topic: L4
  name: 반론 대상 정확화
  skill: 반론이 실제 주장을 겨냥하게 한다
  explanation: 반론은 내가 실제로 한 주장(원칙의 범위 포함)을 겨냥해야 해요.
  demo: 주장이 ‘일부 과목만 숙제를 줄이자’인데 ‘숙제를 모두 없애면 안 된다’고 하면 대상이 빗나간 반론이에요.
  practice: 주장과 반론을 나란히 쓰고, 반론이 겨냥한 부분에 밑줄을 그어 보세요.
- id: 4-7
  topic: L4
  name: 입장 정리
  skill: 반론 검토 후 유지·제한·수정과 이유를 밝힌다
  explanation: 반론을 검토한 뒤 주장을 유지할지, 범위를 줄일지, 고칠지 정하고 이유를 써요. 입장을 바꾸는 것 자체가 더 좋은 것은 아니에요.
  demo: ‘다만 시험 기간에는 예외로 한다’처럼 조건을 붙여 제한할 수 있어요.
  practice: 반론 하나에 대해 유지·제한·수정 중 하나를 골라 이유를 써 보세요.
- id: 5-1
  topic: L5
  name: 핵심 내용 고르기
  skill: 글에 필요한 내용만 고른다
  explanation: 앞선 대화나 제시문 전체를 다 넣지 않아요. 핵심 판단, 이유, 검토한 문제만 골라요.
  demo: 논증 메모 여섯 줄 중 판단·이유·반론 대응 세 줄만 고르는 식이에요.
  practice: 내 메모에서 꼭 필요한 세 가지만 골라 보세요.
- id: 5-2
  topic: L5
  name: 짧은 개요
  skill: 고른 내용의 순서를 짧게 배열한다
  explanation: 개요는 완결 문장이 아니어도 돼요. 순서는 하나로 정해져 있지 않아요.
  demo: ① 내 원칙 ② 이유 ③ 예상 반론과 대응 ④ 마무리 판단.
  practice: 고른 내용을 네 줄 이하 개요로 배열해 보세요.
- id: 5-3
  topic: L5
  name: 논리적 연결
  skill: 문장 사이의 이유·대응 관계를 드러낸다
  explanation: 연결어를 넣는 것보다 앞뒤 문장이 실제로 이유와 결론 관계인지가 중요해요.
  demo: ‘그러므로’ 앞에는 뒤의 판단을 받쳐 주는 내용이 와야 해요.
  practice: 나열된 두 문장을 이유와 결론 관계로 다시 써 보세요.
- id: 5-4
  topic: L5
  name: 하나의 중심 논지
  skill: 글 전체가 하나의 판단으로 이어지게 한다
  explanation: 여러 주장이 경쟁하면 읽는 사람이 무엇이 핵심인지 알기 어려워요. 하나의 중심 판단을 골라요.
  demo: 주장 셋을 늘어놓은 글 → 가장 중요한 하나를 중심으로 나머지를 이유로 바꿔요.
  practice: 내 글의 중심 판단을 한 문장으로 적어 보세요.
- id: 5-5
  topic: L5
  name: 반론과 조건의 결론 반영
  skill: 검토한 반론·한계를 마지막 판단에 반영한다
  explanation: 반론을 소개했다면 마지막 판단이 그 반론을 어떻게 다루는지 보여 줘야 해요.
  demo: ‘물론 ~라는 반론도 있다. 그래서 ~한 경우에는 예외를 둔다.’
  practice: 반론을 반영한 마지막 문장을 하나 써 보세요.
- id: 5-6
  topic: L5
  name: 의미를 지키며 줄이기
  skill: 조건과 근거를 지키며 분량을 줄인다
  explanation: 반복 문장과 중심과 무관한 설명부터 줄이고, 조건과 근거는 남겨요.
  demo: 같은 뜻의 두 문장을 하나로 합치고, 긴 사례 설명을 한 구절로 줄여요.
  practice: 긴 문단 하나를 조건을 지키며 절반으로 줄여 보세요.
- id: 5-7
  topic: L5
  name: 스스로 점검하고 고치기
  skill: 자기 글의 중요한 문제를 찾아 고친다
  explanation: 제출 전에 ‘논제에 답했는가, 근거가 받쳐 주는가, 반론과 결론이 맞는가’를 스스로 점검해요. 고칠 것이 없으면 유지해도 돼요.
  demo: 점검 질문 세 개를 차례로 확인하고, 걸리는 부분만 고쳐요.
  practice: 최근에 쓴 글 하나를 세 질문으로 점검해 보세요.
