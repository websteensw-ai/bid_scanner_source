    claim: "행복은 덕의 실현과 함께 외적 선을 포괄하며, 각자의 선택과 중용, 그리고 공동체의 친애를 통해 스스로 만들어 가는 것이다."
    counter_claim: "행복은 오직 최상의 덕(지성)의 실현에 달려 있으며 외적 조건은 본질이 아니다."
    hidden_premise: "개인의 행복은 공동체의 관계(친애)와 분리될 수 없다."
