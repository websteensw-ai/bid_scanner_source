    tags: [행복, 친애, 우정, 중용, 윤리와정치]
    location: "pdf 58~60쪽 (본문 56~58쪽)"
    summary: "평론은 『에우데모스 윤리학』이 『니코마코스 윤리학』과 짝을 이루며 행복관을 더 유연하게 확장한다고 본다. 행복에는 덕의 실현뿐 아니라 재산·명예·건강 같은 외적 선도 포함되며, 쾌락과 고통은 자발적 선택에서 비롯되므로 덕의 질이 행복의 질을 가른다. 극단을 악덕으로, 중간을 덕으로 보는 중용론과 함께 가족·친구·이웃을 잇는 친애가 공동체 행복의 핵심 요소로 제시된다. 평론은 이를 윤리학과 정치학의 조화 가능성으로 읽는다."
    review: {status: draft, reviewer: ""}

  - id: SRC-H003
