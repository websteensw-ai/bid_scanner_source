    tags: [스토아, 성찰, 리더, 절제, 죽음]
    location: "pdf 89~91쪽 (본문 87~89쪽)"
    summary: "평론은 『명상록』을 황제의 오만이 아니라 평범한 인간으로서 규범을 지키려 애쓴 철학자의 고백 일기로 읽는다. 아우렐리우스는 변하고 소멸하는 육신의 충동이 아니라 지배적 이성으로 자신을 다스릴 때 절제 있는 삶이 가능하다고 보았고, 죽음보다 이성이 잠들어 쾌락과 고통에 굴복하는 상태를 두려워했다. 원하는 것을 다 가질 수 있었던 그가 외부 시선이 아닌 내면의 싸움으로 수신에 매진했다는 점이 강조된다. 평론자는 이를 페스트와 외침 속에서 공동체 의무를 다한 노블레스 오블리주의 전형으로 평가한다."
