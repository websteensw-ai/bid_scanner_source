sources:
  - id: SRC-H001
    title: "『니코마코스 윤리학』 평론 — 『행복한 고전읽기 101』"
    source_type: 고전평론
    asset_type: concept
    author: {original: "아리스토텔레스", commentary: "박경귀"}
    work: "『니코마코스 윤리학』"
    era: 고대
    region: 그리스
    fields: [철학, 윤리]
    persons: ["아리스토텔레스", "플라톤"]
    public: summary
    copyright: own
    pilot_group: 철학
    concepts: ["행복(에우다이모니아)", "탁월성(아레테)", "성격적 탁월성", "중용", "습관화"]
    claim: "행복은 타고나는 것이 아니라 좋은 행위를 반복해 길러진 성격적 탁월성, 곧 중용의 품성에서 나온다."
    counter_claim: "행복은 품성보다 재산·건강·운 같은 외적 조건에 의해 좌우된다."
    hidden_premise: "인간의 품성은 교육과 습관을 통해 바뀔 수 있다."
    counterexamples: ["『에우데모스 윤리학』의 포괄주의적 행복관처럼 재산·명예·건강 같은 외적 선을 행복의 요소로 보는 입장"]
    conflicts: ["품성 vs 외적 조건", "무절제 vs 목석 같음"]
    universal_question: "행복은 얻는 것인가, 길러지는 것인가?"
    tags: [행복, 덕윤리, 중용, 습관, 교육]
    location: "pdf 55~57쪽 (본문 53~55쪽)"
    summary: "평론은 행복을 그 자체로 추구되는 최고선으로 규정한 아리스토텔레스의 논의를 소개한다. 행복을 결정짓는 것은 육체가 아닌 영혼의 탁월성이며, 지적 탁월성은 학습으로, 성격적 탁월성은 습관으로 길러진다. 두려움 앞의 용기, 즐거움 앞의 절제처럼 지나침과 모자람 사이의 중용이 최고의 탁월성이라는 점을 강조한다. 결국 행복은 자신의 생각·행동·습관에 달렸다고 정리한다."
    review: {status: draft, reviewer: ""}

  - id: SRC-H002
    title: "『에우데모스 윤리학』 평론 — 『행복한 고전읽기 101』"
    source_type: 고전평론
    asset_type: concept
    author: {original: "아리스토텔레스", commentary: "박경귀"}
    work: "『에우데모스 윤리학』"
    era: 고대
