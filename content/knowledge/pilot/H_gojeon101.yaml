    source_type: 고전평론
    asset_type: concept
    author: {original: "에피쿠로스", commentary: "박경귀"}
    work: "『쾌락』"
    era: 고대
    region: 그리스
    fields: [철학, 윤리]
    persons: ["에피쿠로스", "데모크리토스", "피론", "존 스튜어트 밀"]
    public: summary
    copyright: own
    pilot_group: 철학
    concepts: ["쾌락주의", "아타락시아(마음의 평정)", "헛된 욕망", "자연적 정의", "원자론"]
    claim: "진정한 쾌락은 헛된 욕망을 걸러내고 자연에 대한 이성적 이해로 공포와 미신에서 벗어나 얻는 마음의 평정이다."
    counter_claim: "쾌락을 최고선으로 삼으면 판단이 감각에 의존하게 되어 덕과 공동체의 책무를 소홀히 하게 된다."
    hidden_premise: "고통과 공포의 상당 부분은 무지와 잘못된 믿음에서 생긴다."
    counterexamples: ["감각적 쾌락을 강조한 점 때문에 스토아학파의 공격을 받은 사례", "개인과 공동체 사이의 사회적·정치적 갈등에 대한 해답은 제시하지 못했다는 평론의 비판"]
    conflicts: ["쾌락 vs 덕", "개인의 평정 vs 공동체 참여"]
    universal_question: "고통이 없는 상태는 곧 행복한 상태인가?"
    tags: [쾌락, 행복, 헬레니즘, 개인주의, 평정]
    location: "pdf 79~82쪽 (본문 77~80쪽)"
    summary: "평론은 에피쿠로스의 쾌락주의가 펠로폰네소스 전쟁 패배 이후 좌절과 개인주의가 퍼진 아테네의 시대적 산물이라고 본다. 에피쿠로스는 쾌락을 나쁘게 보지 않았으나 자연적이지도 필연적이지도 않은 헛된 욕망은 몰아내야 한다고 했고, 서로 해치지 않기로 한 상호 이익의 협정을 자연적 정의로 보았다. 마음의 평정은 덕이 아니라 자연학을 통해 미신과 공포에서 벗어날 때 얻어진다는 점에서 회의론과 구별된다. 평론은 이 사상이 공동체 속 갈등에는 답하지 못한 시대적 한계를 지닌다고 평가한다."
    review: {status: draft, reviewer: ""}

