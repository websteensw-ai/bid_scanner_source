    claim: "외적 제약이 없는 권력자일수록 지배적 이성으로 스스로를 다스리는 내면의 투쟁이 필요하며, 그 수신은 공동체에 대한 의무 실천으로 이어져야 한다."
    counter_claim: "도덕적 절제는 외부의 감시와 제도로 보장되는 것이지 개인의 내면 수양에 기댈 수 없다."
