    conflicts: ["감성 vs 이성", "개인의 안락 vs 공공의 책무"]
    universal_question: "삶의 ‘어떻게’에 몰두하느라 ‘왜’를 잃고 있지는 않은가?"
    tags: [최고선, 절충, 로마철학, 삶의목적]
    location: "pdf 86~88쪽 (본문 84~86쪽)"
    summary: "평론은 키케로가 헬레니즘 시대의 두 학파를 비판적으로 소화해 대안을 제시했다고 본다. 에피쿠로스파는 판단을 감각에 맡기고 공적 책무를 소홀히 한다는 점에서, 스토아파는 건강·가사·통치 같은 일상의 의무를 배제해 도덕성마저 소멸시킨다는 점에서 비판된다. 키케로는 정신과 육체의 덕이 함께 쌓여야 최고선에 다가간다는 절충적 관점을 택한다. 평론자는 이를 통해 삶의 목적을 묻지 않는 현대인의 얄팍함을 돌아보게 한다."
