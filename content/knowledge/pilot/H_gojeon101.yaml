    concepts: ["무위자연", "무용지용(쓸모없음의 쓰임)", "분수", "팔자사환", "무심"]
    claim: "인위적 욕망과 경쟁을 내려놓고 본성대로 사는 무위자연의 태도는, 유위의 삶을 살 수밖에 없는 현대인에게도 자기 직분에 꾸밈없이 정성을 다하는 방식으로 실천될 수 있다."
    counter_claim: "부와 권력·지식에 대한 욕망은 인간 본성에 내장되어 있으므로 무위자연은 현실도피적 이상에 불과하다."
    hidden_premise: "인간의 참된 본성은 욕망이 아니라 꾸밈없는 맑은 마음이다."
    counterexamples: ["경쟁적 자본주의 사회에서 직업적 열정 없이는 생존하기 어렵다는 현실", "장자의 관점이 반주지주의·반문명주의로 비칠 수 있다는 평론의 지적"]
    conflicts: ["무위 vs 유위", "본성 vs 문명", "쓸모 vs 쓸모없음"]
    universal_question: "쓸모 있는 사람이 되려는 노력은 언제 나를 잃게 만드는가?"
    tags: [노장사상, 무위, 문명비판, 자유, 현대인]
    location: "pdf 71~78쪽 (본문 69~76쪽)"
    summary: "평론자는 장자가 노자의 무위 사상을 더 과감하게 밀고 나가 유가의 인의와 예를 인위적인 것으로 비판했다고 소개한다. 쓸모없어 베이지 않은 거목, 나비 꿈, 어부의 팔자사환론, 두레박을 거부한 노인의 우화 등을 통해 분수에 맞는 삶과 기계·문명에 사로잡힌 마음의 위험을 짚는다. 동시에 욕망이 본성일 수도 있고 현대인이 무위를 그대로 실천하기는 어렵다고 인정한다. 결론적으로 무위는 게으름이 아니라 유위의 삶 속에서 꾸밈없이 정성을 다하는 태도로 재해석된다."
    review: {status: draft, reviewer: ""}

  - id: SRC-H004
