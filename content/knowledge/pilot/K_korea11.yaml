topics:
  - id: TOP-K01
    archetypes: [ARC-K04]
    prompt: "어느 학교 축구부가 연패에 빠졌다. 감독은 ‘상대 팀 분석과 외부 코치 영입’이 해법이라 하고, 주장은 ‘팀 내 불화와 특정 선수 특혜부터 바로잡아야 한다’고 한다. 공동체가 위기에 처했을 때 먼저 바로잡아야 할 것은 외부 대비인가, 내부 문제인가?"
