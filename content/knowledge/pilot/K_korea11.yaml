sources:
  - id: SRC-K001
    title: "대한민국의 현실과 당면과제 — 『11인 지성들의 대한민국 진단』"
    source_type: 강연평설
    asset_type: policy
    author: {original: "노재봉(강연)", commentary: 박경귀}
    work: 『11인 지성들의 대한민국 진단』
    era: 현대
    region: 동아시아
    fields: [정치, 역사, 사회]
    persons: [노재봉, 루이 16세, 나폴레옹, 헤르더, 피히테, 비스마르크]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [민족국가, 근대성, 시민, 반사적 정체성, 국가 개조]
    claim: "근대국가는 왕과 신민의 오랜 투쟁 속에서 권리와 의무를 자각한 시민이 형성되며 완성되는데, 한국은 분단과 시민 의식의 미성숙으로 아직 ‘미완의 근대국가’이므로 국가 운영 전반의 개혁이 필요하다."
    counter_claim: "근대국가의 완성은 서구식 경로를 반드시 따를 필요가 없으며, 이미 민주화와 산업화를 이룬 한국은 근대국가의 요건을 충분히 갖추었다."
    hidden_premise: "유럽의 근대국가 형성 과정이 국가 발전의 보편적 기준이 될 수 있다."
    counterexamples: ["노 전 총리 스스로 오늘날에는 본받을 만한 준거국가가 없어 창의적 국가 모델이 필요하다고 말함"]
    conflicts: ["제도 이식 vs 시민 형성", "권리 vs 의무"]
    universal_question: "좋은 국가는 훌륭한 제도로 만들어지는가, 성숙한 시민으로 만들어지는가?"
    tags: [국가론, 근대국가, 민족주의, 시민의식, 정부혁신, 복지]
    location: "pdf 11-23쪽"
    summary: "노재봉 전 총리의 ‘국가론’ 강연 평설이다. 베스트팔렌 조약 이후의 민족국가, 산업혁명과 민주혁명이 결합해 만든 근대성, 투쟁 속에서 탄생한 ‘시민’ 개념을 설명한 뒤, 분단으로 민족국가가 미완이고 시민 의식도 성숙하지 못한 한국의 현실을 진단한다. 복지 수요 증가와 세계화에 대응하기 위해 예산·교육·대기업·정부 역할의 개혁과 창의적 국가 모델을 제안하며, 남의 시선에 기대는 ‘반사적 정체성’을 경계한다(대북 전략 부분은 요약에서 제외)."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}
  - id: SRC-K002
    title: "경제위기 리스크 관리가 우선이다 — 『11인 지성들의 대한민국 진단』"
    source_type: 강연평설
    asset_type: policy
    author: {original: "조윤제(강연)", commentary: 박경귀}
    work: 『11인 지성들의 대한민국 진단』
    era: 현대
    region: 세계
    fields: [경제, 사회, 정책]
    persons: [조윤제, 앨런 그린스펀, 케네스 로고프, 카르멘 레인하르트, 얀 펜]
    public: summary
    copyright: own
    pilot_group: 과학·사회·문명
    concepts: [재정 통합 없는 통화 통합, 재정위기, 대위축, 가계부채, 고령화, 재정건전성]
    claim: "세계 경제 위기는 제도·재정·신뢰·구조조정 지연이 얽힌 구조적 ‘대위축’이므로, 한국은 복지 수요에 대응하면서도 긴축 기조와 재정건전성을 지키는 리스크 관리를 우선해야 한다."
    counter_claim: "경기 침체기에는 오히려 적극적 재정 지출로 수요와 복지를 늘려야 경제와 사회가 함께 회복된다."
    hidden_premise: "미래의 불확실성이 클수록 재정 여력을 비축하는 것이 가장 안전한 대비책이다."
    counterexamples: ["강연자 스스로 고령화·양극화·노인 자살률 등으로 복지 확대의 필요성을 인정함", "금융위기 극복에 고환율·저금리·신용보증 확대 같은 확장 정책이 기여했다는 진단"]
    conflicts: ["복지 확대 vs 재정 건전성", "현재 세대 vs 미래 세대"]
    universal_question: "오늘의 필요를 채우는 것과 내일의 위험에 대비하는 것 중 무엇을 먼저 해야 하는가?"
    tags: [세계경제, 유로존, 재정정책, 복지포퓰리즘, 고령화, 소득불평등]
    location: "pdf 24-39쪽"
    summary: "조윤제 교수의 ‘세계경제 환경과 한국’ 강연(2012년 3월) 평설이다. 그는 유로존처럼 재정 통합 없는 통화 통합, 금융위기의 재정위기 전이, 선진국 정책에 대한 신뢰 위기, 구조조정 지연을 세계 경제의 문제로 꼽고, 이번 위기를 단순 경기 순환이 아닌 ‘대위축’으로 본다. 한국에 대해서는 가계부채, 고령화, 소득 양극화를 위험 요인으로 지적하며, 복지 확대에 공감하되 선거철의 무분별한 재정 팽창 공약을 경계하고 재정건전성을 강조한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}
  - id: SRC-K003
    title: "동반성장과 상생의 길 — 『11인 지성들의 대한민국 진단』"
    source_type: 강연평설
    asset_type: policy
    author: {original: "정운찬(강연)", commentary: 박경귀}
    work: 『11인 지성들의 대한민국 진단』
    era: 현대
    region: 동아시아
    fields: [경제, 사회, 정책]
    persons: [정운찬, 존 로크, 자크 아탈리]
    public: summary
    copyright: own
    pilot_group: 과학·사회·문명
    concepts: [동반성장, 경제 선순환, 초과이익공유제, 적극적 우대조치, 중소기업 적합업종]
    claim: "대기업에 쌓인 여유자금이 중소기업과 가계로 흘러가는 동반성장 구조를 만들어야 경제의 악순환을 끊고 집중된 경제 권력으로부터 보통 사람의 권익도 지킬 수 있다."
    counter_claim: "이익 공유나 업종 지정 같은 개입은 자유 시장경제의 원리에 어긋나고 기업의 경쟁력과 투자 의욕을 떨어뜨린다."
    hidden_premise: "시장에만 맡기면 경제력 집중이 심화되어 성장의 과실이 고르게 퍼지지 않는다."
    counterexamples: ["초과이익의 크기와 협력사 기여도를 합리적으로 산정하기 어렵다는 재계의 반론", "평설자가 제시한 B2B·B2C 특성을 고려한 선별적 적용 필요성"]
    conflicts: ["시장 자율 vs 상생을 위한 개입", "효율 vs 형평"]
    universal_question: "강자와 약자가 함께 성장하도록 규칙을 정하는 것은 공정한가, 시장을 왜곡하는가?"
    tags: [동반성장, 대기업, 중소기업, 가계부채, 교육개혁, 경제민주화]
    location: "pdf 40-47쪽"
    summary: "정운찬 동반성장위원장의 강연(2012년 2월) 평설이다. 그는 성장률 하락, 세계 경기 동반 침체, 가처분소득의 150%에 이른 가계부채를 위험 신호로 보고, 투자 촉진·교육개혁·R&D 방향 전환을 통한 경제 선순환을 제시하며 그 핵심으로 대·중소기업 동반성장을 강조한다. 평설자는 초과이익공유제를 둘러싼 시장원리 논쟁을 소개하고, 협력이익 배분의 정교한 설계와 불공정 거래 관행 개선, 재계와의 협력 관계 구축이 과제라고 덧붙인다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}
  - id: SRC-K004
    title: "내부의 적을 더 경계하라 — 『11인 지성들의 대한민국 진단』"
    source_type: 강연평설
    asset_type: history
    author: {original: "채명신(강연)", commentary: 박경귀}
    work: 『11인 지성들의 대한민국 진단』
    era: 현대
    region: 동아시아
    fields: [역사, 군사, 정치]
    persons: [채명신, 호치민]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [지피지기, 동맹, 내부의 적, 대의명분, 지도자의 청렴]
    claim: "6·25전쟁과 베트남전의 경험에 비추어 볼 때, 국가의 존망은 외부의 군사력보다 내부의 부패와 분열, 전쟁 목적의 정당성, 지도자의 청렴에 더 크게 좌우된다."
    counter_claim: "국가 안보의 핵심은 결국 군사력과 동맹의 힘이며, 내부 요인을 지나치게 강조하면 정당한 비판까지 ‘내부의 적’으로 몰릴 위험이 있다."
    hidden_premise: "부패하고 분열된 공동체는 위기 때 구성원과 외부의 지지를 얻지 못한다."
    counterexamples: ["채 장군 스스로 6·25전쟁은 미국 등 동맹의 도움 없이는 이길 수 없었다고 강조함"]
    conflicts: ["외부 위협 대비 vs 내부 개혁", "결속 vs 비판의 자유"]
    universal_question: "공동체를 무너뜨리는 것은 바깥의 적인가, 안의 부패와 분열인가?"
    tags: [6·25전쟁, 베트남전, 리더십, 부패, 동맹, 전쟁의 교훈]
    location: "pdf 48-51쪽"
    summary: "초대 주월한국군 사령관 채명신 장군의 마지막 공개 강연(2012년 2월) 평설이다. 그는 6·25전쟁의 교훈으로 위장 평화 공세에 속지 말 것(지피지기), 동맹의 굳건한 유지, 내부의 적에 대한 경계를 들고, 자유베트남의 패망을 부패와 내부 분열의 결과로 해석한다. 또 전쟁 승리의 조건으로 정당한 대의명분과 청렴한 지도자를 꼽으며, 적대적 부하까지 포용한 그의 리더십 일화도 소개된다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}
  - id: SRC-K005
    title: "김정은 체제의 미래와 한반도 — 『11인 지성들의 대한민국 진단』"
    source_type: 강연평설
    asset_type: policy
    author: {original: "김희상(강연)", commentary: 박경귀}
    work: 『11인 지성들의 대한민국 진단』
    era: 현대
    region: 동아시아
    fields: [안보, 정치, 외교]
    persons: [김희상, 제임스 릴리, 리처드 하스, 황장엽, 즈비그뉴 브레진스키]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [관여 정책, 핀란드화, 선군정치, 간접침략, 전략적 실패]
    claim: "적대적 정권에 대한 대규모 지원과 유화 정책은 의도와 달리 그 정권의 생존과 군사력 증강을 도왔으므로, 대북 정책은 단호함과 억지력을 기반으로 해야 한다."
    counter_claim: "관여와 교류는 긴장을 낮추고 상대 사회의 변화를 유도하는 수단이며, 압박만으로는 충돌 위험을 키울 수 있다."
    hidden_premise: "상대 정권의 최우선 목표는 체제 유지와 대남 우위이며, 경제 지원은 그 목표에 전용된다."
    counterexamples: []
    conflicts: ["관여 vs 압박", "평화 유지 vs 억지력 강화"]
    universal_question: "적대적인 상대를 돕는 것은 평화를 앞당기는가, 상대를 강하게 만드는가?"
    tags: [대북정책, 햇볕정책, 한미동맹, 중국, 안보]
    location: "pdf 64-73쪽"
    summary: "김희상 한국안보문제연구소 이사장의 강연(2012년 6월 무렵) 평설이다. 그는 중국을 한반도 정세의 핵심 변수로 보며 한반도의 ‘핀란드화’ 가능성까지 경고하고, 북한 경제난은 군사력 증강에 자원을 집중한 결과라고 분석한다. 1990년대 후반 위기를 통일의 기회로 보았으나 과거 대북 지원 정책이 오히려 정권의 생존과 핵 개발을 도왔다며 이를 전략적 실패로 평가하고, 사회 혼란을 노린 간접침략에 대한 경계를 촉구한다. 강연자의 정치적 평가가 강하게 담긴 글이므로 활용 시 반대 관점을 함께 제시해야 한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}
archetypes:
  - id: ARC-K01
    question: "좋은 국가는 훌륭한 제도로 만들어지는가, 성숙한 시민으로 만들어지는가?"
    sources: [SRC-K001]
    conflicts: ["제도 이식 vs 시민 형성"]
    concepts: [근대성, 시민, 권리와 의무, 반사적 정체성]
    positions: ["제도를 잘 설계하면 시민의 행동도 따라 바뀐다", "권리와 의무를 자각한 시민이 없으면 좋은 제도도 작동하지 않는다"]
    counterexamples: ["유럽 근대국가가 수백 년의 투쟁을 거쳐 시민을 만들어 냈다는 노재봉의 설명"]
    situations: ["학교 자치 규칙을 만들었지만 아무도 지키지 않는 경우", "민주 제도를 도입한 신생국의 정치 불안"]
    abilities: [understand, define, reason, counter]
    level_range: [3, 5]
  - id: ARC-K02
    question: "오늘의 필요를 채우는 것과 내일의 위험에 대비하는 것 중 무엇을 먼저 해야 하는가?"
    sources: [SRC-K002, SRC-K001]
    conflicts: ["복지 확대 vs 재정 건전성"]
    concepts: [재정건전성, 복지 수요, 고령화, 포퓰리즘, 세대 간 형평]
    positions: ["지금 고통받는 사람을 돕는 복지 확대가 우선이다", "불확실한 미래에 대비해 재정 여력을 지키는 것이 우선이다"]
    counterexamples: ["고령화로 현행 제도만으로도 복지 지출이 급증한다는 조윤제의 경고", "노인 자살률 등 사회지표가 보여주는 복지 수요"]
    situations: ["선거철 대규모 복지 공약 평가", "가정의 저축과 현재 소비 사이의 선택"]
    abilities: [understand, reason, respond, counter]
    level_range: [2, 4]
  - id: ARC-K03
