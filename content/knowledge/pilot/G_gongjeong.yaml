sources:
  - id: SRC-G001
    title: "특권 없는 국회가 되라 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: policy
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [정치, 법]
    persons: [제임스 뷰캐넌]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [정치실패, 지대추구, 대리인 문제, 의원 특권, 자정기능]
    claim: "국회의원은 국민의 대리인일 뿐이므로 특권을 내려놓고, 동료 의원이 아닌 외부 민간위원이 의원 윤리를 심사하도록 국회를 개혁해야 한다."
    counter_claim: "의원 징계는 입법부의 자율권에 속하므로 외부 위원에게 넘기면 권력분립과 의회 독립이 훼손된다."
    hidden_premise: "같은 집단의 구성원은 서로를 엄정하게 심판하지 못하며, 외부 위원은 정파적 이해에서 상대적으로 자유롭다."
    counterexamples: ["외부 위원도 추천 정당의 영향을 받아 정파적으로 움직일 수 있다", "입법 규제가 모두 지대추구인 것은 아니며 시장 실패를 바로잡는 입법도 있다"]
    conflicts: ["대표자의 자율 vs 외부 통제", "특권 보장 vs 책임 추궁"]
    universal_question: "권력을 위임받은 사람을 누가, 어떻게 감시해야 하는가?"
    tags: [국회, 특권, 윤리특별위원회, 지대추구, 공공선택론]
    location: "pp.12~17"
    summary: "저자는 한국 국회의 문제를 무능·부패를 넘어선 총체적 정치실패로 진단한다. 과도한 세비와 무노동 무임금 미적용 등 특권, 입법권을 이용한 경제적·이념적 지대추구를 비판한다. 의원 징계를 동료 의원에게 맡기는 윤리특별위원회는 자정 기능을 잃었다며 전원 민간위원으로 구성하자고 제안하고, 위헌 정당 해산 시 국고보조금 환수 등 제도 보완도 주장한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}

  - id: SRC-G002
    title: "국회, 공정의 파수꾼이 되라 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: concept
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [정치, 법, 철학]
    persons: [플라톤, 아리스토텔레스, 한비자]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [법의 지배, 법에 의한 지배, 지성의 배분, 훌륭한 법질서(에우노미아), 민중선동]
    claim: "통치자도 법 아래 놓이는 '법의 지배'가 민주정의 전제이며, 입법은 지성에 근거해야지 대중 선동이나 특권 유지 수단이 되어서는 안 된다."
    counter_claim: "민주정에서 법의 정당성은 입법자의 지성보다 다수 시민의 의사에서 나오므로, 대중의 요구를 반영하는 입법이 곧 정당한 입법이다."
    hidden_premise: "무엇이 '지성적'이고 '최선'인 법인지 판별할 수 있는 기준이 존재한다."
    counterexamples: ["지성을 앞세운 엘리트 입법이 다수 시민의 이익을 외면한 사례", "대중 운동이 기존 법의 부정의를 바로잡은 사례(참정권 확대 등)"]
    conflicts: ["법의 지배 vs 다수의 의지", "전문성 vs 민주적 정당성"]
    universal_question: "법이 통치자를 지배하는가, 통치자가 법을 도구로 쓰는가?"
    tags: [법치, 플라톤, 법률, 입법, 포퓰리즘]
    location: "pp.18~22"
    summary: "플라톤의 《법률》을 통해 입법의 원리를 살핀다. 플라톤은 이상국가 다음 차선으로 지성을 갖춘 입법자가 만든 법에 통치자까지 복종하는 법치 국가를 구상했다. 저자는 이를 근대적 '법의 지배'와 연결하고, 통치자가 법을 자의적 도구로 쓰는 '법에 의한 지배'(중국 법가)와 구별한다. 아리스토텔레스의 민중선동가 경고를 인용하며 국회가 선동에 흔들리지 말고 공정의 보루가 되라고 촉구한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}

  - id: SRC-G003
    title: "내 주권 뺏어가는 연동형 비례대표제 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: policy
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [정치, 법]
    persons: []
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [연동형 비례대표제, 다수대표제, 투표의 비례성, 정치적 안정, 국민 주권]
    claim: "대통령제·단원제 국회에서 연동형 비례대표제를 도입하면 다당제와 정치 불안을 낳고 정당 지도부에 의원 선정권을 넘겨 국민 주권을 훼손하므로, 충분한 국민적 합의 없이 추진해서는 안 된다."
    counter_claim: "연동형 비례대표제는 사표를 줄이고 득표율과 의석의 괴리를 바로잡아 다양한 민의를 반영하므로 오히려 국민 주권을 강화한다."
    hidden_premise: "양당 구조가 다당제보다 정치적 안정과 국익에 유리하다."
    counterexamples: ["독일·뉴질랜드처럼 비례성 높은 제도에서도 안정적 연정이 운영된 사례", "지역구 다수대표제가 지역주의와 사표를 심화시킨 사례"]
    conflicts: ["비례성 vs 정치적 안정", "다양한 대표 vs 직접 선출"]
    universal_question: "공정한 선거제도란 표의 가치를 똑같이 반영하는 것인가, 안정된 정부를 만드는 것인가?"
    tags: [선거제도, 비례대표, 대통령제, 다당제, 패스트트랙]
    location: "pp.29~39 (데일리안 2019-03-24 기고)"
    summary: "2019년 선거제 개편 논의에 대한 기고문이다. 저자는 대통령제와 연동형 비례대표제의 조합은 세계적으로 드물고, 다당제를 고착해 정치 불안과 연정 거래를 낳을 수 있다고 본다. 비례대표 선정권이 정당 지도부에 있어 유권자의 통제가 약하다는 점, 위헌 소지를 지적하며 비례성은 중대선거구제 등으로 보완할 수 있다고 제안한다. 권력구조와 함께 국민적 합의를 거쳐 천천히 논의하자고 주장한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}

  - id: SRC-G004
    title: "보이지 않는 복지를 보라 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: policy
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [정치, 경제, 행정]
    persons: [키케로]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [보이는 복지, 보이지 않는 복지, 재정 지속가능성, 포퓰리즘, 중앙-지방 재정분담]
    claim: "위정자는 즉각적 수혜감을 주는 개인 현금성 복지보다 공공 인프라·교육 같은 '보이지 않는 복지'와 재정 여건에 맞춘 단계적 복지를 중시해야 한다."
    counter_claim: "당장 생활이 어려운 사람에게는 직접 지원이 가장 시급하고 확실한 복지이며, 보편적 직접 지원도 장기적 인적 투자가 될 수 있다."
    hidden_premise: "유권자는 근시안적 수혜를 선호하고 정치인은 그에 영합하는 경향이 있다."
    counterexamples: ["무상급식처럼 직접 지원이 교육 여건과 아동 건강 개선으로 이어졌다는 평가", "인프라 투자도 정치적 생색내기용 사업으로 변질되는 사례"]
    conflicts: ["단기 수혜 vs 장기 투자", "복지 확대 vs 재정 건전성"]
    universal_question: "눈에 보이지 않는 공공의 이익을 위해 눈앞의 요구를 미룰 수 있는가?"
    tags: [복지, 무상복지, 스웨덴 모델, 지방재정, 포퓰리즘]
    location: "pp.44~46"
    summary: "저자는 개인에게 직접 주는 복지를 '보이는 복지', 도시 인프라·문화시설 등 불특정 다수를 위한 복지를 '보이지 않는 복지'로 구분한다. 정책 선택이 시민의 근시안적 욕구에 끌려가기 쉽다고 경고하며, 스웨덴이 성장과 근로 책무를 바탕으로 복지를 조정한 사례를 든다. 또 중앙정치가 지자체와 협의 없이 무상복지 비용을 떠넘기는 문제를 지적하고 재원에 맞춘 단계적 도입을 촉구한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}

  - id: SRC-G005
    title: "상식에 어긋난 판사는 퇴출되어야 한다 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: policy
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [법, 행정]
    persons: [잭 웰치]
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [법관 재임용 심사, 근무성적평정, 상대평가, 사법 독립, 사법 신뢰]
    claim: "법관 재임용 심사는 객관적 실적과 근무평정에 근거해 엄격히 운영되어야 하며, 실적이 현저히 불량한 판사는 퇴출해야 한다."
    counter_claim: "판사에게 성과 평가와 퇴출 위협을 가하면 다수 여론이나 인사권자의 눈치를 보게 되어 사법 독립이 훼손된다."
    hidden_premise: "판사의 직무 성과를 객관적으로 측정할 수 있으며, 평가 결과가 판결 내용에 대한 압력으로 작용하지 않게 분리할 수 있다."
    counterexamples: ["재판 처리 건수 위주 평가가 신중한 심리를 저해할 수 있다", "인사평가가 특정 성향 판사를 배제하는 도구로 악용된 논란"]
    conflicts: ["사법 독립 vs 책임성", "신분 보장 vs 성과 평가"]
    universal_question: "독립성이 필요한 직위의 사람을 평가하고 해임할 수 있는가?"
    tags: [사법부, 법관, 재임용, 성과평가, 철밥통]
    location: "pp.47~50"
    summary: "근무평정 하위 판사의 재임용 탈락 논란을 계기로 쓴 글이다. 저자는 평가에 한계가 있어도 평가 자체를 부정할 수는 없다며, 민간 기업과 지자체의 저성과자 관리와 비교해 법관 재임용 심사가 유명무실했다고 비판한다. 막말 같은 품위 문제는 징계로 다루고 재임용은 실적으로 판단해야 한다고 구분하며, 재판의 독립을 위축시켜서는 안 된다는 단서도 단다. 경력 법조인을 판사로 충원하는 유연한 제도를 대안으로 제시한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}

  - id: SRC-G006
    title: "실현가능한 공약이 좋은 공약이다 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: policy
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [정치, 행정]
    persons: []
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [정책의 소망성, 실현가능성, 인수위원회, 정책평가, 공론화]
    claim: "공약은 소망성과 실현가능성을 모두 갖추어야 정책이 될 수 있으므로, 인수위는 서둘러 공약을 밀어붙이기보다 검증과 공론화를 거쳐 정책화해야 한다."
    counter_claim: "선거로 위임받은 공약은 국민과의 약속이므로 관료의 현실론에 밀려 수정되기보다 원안대로 신속히 이행되어야 한다."
    hidden_premise: "선거 공약은 충분한 정책 분석 없이 급조되는 경우가 많다."
    counterexamples: ["실현가능성 검토를 이유로 개혁 공약이 관료 저항에 무력화된 사례", "초기에 신속히 추진하지 않아 개혁 동력을 잃은 정부 사례"]
    conflicts: ["약속 이행 vs 실현가능성", "개혁 속도 vs 숙의"]
    universal_question: "약속을 지키는 것과 상황에 맞게 약속을 고치는 것 중 무엇이 더 책임 있는 태도인가?"
    tags: [공약, 인수위, 정책결정, 관료제, 공론화]
    location: "pp.51~55"
    summary: "새 정부나 지자체장 인수위와 관료 사이의 갈등을 이상적 가치와 현실 제약의 충돌로 해석한다. 저자는 정책이 바람직함(소망성)과 법·예산·인력 등 실현가능성을 함께 충족해야 한다고 본다. 대안으로 이론과 실무를 겸비한 정책 전문가 양성, 상시 정책평가, 취임 후 공론화를 거친 과제 확정, 인수위의 비전 설정 집중과 인적 구성 개선을 제시한다."
    review: {status: approved, reviewer: 교육과정 설계 책임자, date: "2026-11-22"}

  - id: SRC-G007
    title: "90% 노동자 외면하는 10% 귀족 노조 — 『공정이 먼저다』"
    source_type: 칼럼
    asset_type: policy
    author: {original: "", commentary: 박경귀}
    work: 『공정이 먼저다』
    era: 현대
    region: 한국
    fields: [정치, 노동, 사회]
    persons: []
    public: summary
    copyright: own
    pilot_group: 정치·법
    concepts: [노조 조직률, 대표성, 과다대표, 기득권, 노사 대화]
    claim: "노조가 투쟁 일변도와 정치화로 다수 노동자의 지지를 잃었으므로, 대화와 합법적 활동으로 다수 노동자를 대변하는 방향으로 바뀌어야 한다."
