    conflicts: ["정의를 위한 참여 vs 정의를 지키기 위한 거리두기", "다수의 통치 vs 아는 자의 통치"]
    universal_question: "부패한 공적 영역에서 옳은 사람은 안으로 들어가 싸워야 하는가, 밖에 남아 자신을 지켜야 하는가?"
    tags: [소크라테스, 민주정 비판, 등에, 페리클레스, 선동가]
    location: "PDF 19~22쪽"
    summary: "소크라테스는 페리클레스의 황금기에 자랐고 장년기에 펠로폰네소스 전쟁과 아테네의 타락을 지켜보았다. 페리클레스 사후 선동가에게 휘둘린 민회는 불법적 결정을 잇달아 내렸다. 소크라테스는 모든 것을 안다고 믿는 무지한 군중이 이끄는 민주정을 비판하고, 시민들에게 통치에 앞서 덕을 쌓으라고 호소했다. 그 자신은 정치가가 아니라 사인으로 사는 길을 택했다."
