    situation: "기원전 406년 아르기누사이 해전에서 대승한 뒤 폭풍 때문에 난파 선원을 구조하지 못하자, 민회에서 장군들의 책임을 묻는 여론이 선동으로 격앙됨."
    choice: "협의회 위원들이 군중의 협박에 겁먹어 장군들을 한꺼번에 표결하는 위법 안건에 찬성할 때, 소크라테스만 개인별 심리를 규정한 법에 어긋난다며 홀로 반대함."
