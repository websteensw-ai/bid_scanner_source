    concepts: [준법, 암묵적 동의, 시민 불복종, 보복 금지]
    positions: ["규칙의 혜택을 누려 온 사람은 불리할 때도 규칙을 지켜야 한다", "부당한 결정에 따르는 것은 불의에 가담하는 것이므로 거부할 수 있다"]
    counterexamples: ["크리톤의 논거처럼 원칙을 지키는 선택이 가족 등 타인에게 피해를 주는 경우"]
    situations: ["부당하다고 느끼는 징계를 받은 학생이 결정을 따를지 거부할지 고민하는 상황", "불합리한 판정을 받은 선수가 경기를 거부할지 고민하는 상황"]
    abilities: [understand, reason, respond, counter]
    level_range: [1, 4]

  - id: ARC-J04
    question: "공동체의 규칙과 가족·가까운 사람에 대한 도리가 충돌할 때 무엇이 우선하는가?"
    sources: [SRC-J006]
    conflicts: ["국법 vs 인륜", "법의 일관성 vs 가족에 대한 의무"]
    concepts: [자연법, 실정법, 연고주의, 예외 없는 법 집행]
    positions: ["법보다 앞서는 인간의 도리가 있으며 그것을 거스르는 법은 따를 수 없다", "가족을 이유로 예외를 허용하면 법의 공정성이 무너진다"]
    counterexamples: ["혈연·지연이 인륜으로 포장되어 청탁과 특혜를 정당화하는 경우"]
    situations: ["가족이 저지른 잘못을 알게 된 사람이 신고할지 고민하는 상황", "규칙상 금지된 일을 친구를 위해 눈감아 줄지 고민하는 상황"]
    abilities: [understand, define, reason, counter]
    level_range: [1, 4]

  - id: ARC-J05
    question: "공동체가 타락하거나 갈라졌을 때, 옳은 사람은 안으로 들어가 싸워야 하는가 물러나 자신을 지켜야 하는가?"
    sources: [SRC-J003, SRC-J005]
    conflicts: ["개인의 안전 vs 공동체 참여의 의무", "중립의 자유 vs 연대 책임"]
    concepts: [시민 참여, 중립, 공인과 사인, 침묵하는 다수]
    positions: ["참여하지 않는 시민은 공동체의 타락에 책임을 나눠지며 권리를 누릴 자격도 줄어든다", "부패한 장에 뛰어들면 자신과 정의가 함께 무너지므로 거리를 두는 것도 정의를 지키는 방식이다"]
    counterexamples: ["어느 편에도 서지 않은 사람 덕분에 극단적 대립이 누그러진 경우", "솔론의 개혁이 모든 계층의 불만을 산 점"]
    situations: ["학교 내 따돌림을 목격했지만 끼어들지 않는 다수", "양극화된 정치 논쟁에서 판단을 유보하는 시민"]
    abilities: [understand, reason, respond, counter, rebut]
    level_range: [1, 5]

  - id: ARC-J06
    question: "공동체를 이끌 자격은 능력과 성과에서 오는가, 무엇이 옳은지에 대한 앎과 절제에서 오는가?"
    sources: [SRC-J004, SRC-J003]
    conflicts: ["이익 vs 정의", "야망 vs 자기 인식"]
    concepts: [지도자의 자격, 무지의 지, 절제, 정의와 이익]
    positions: ["지도자는 결과로 평가받으므로 공동체에 이로운 성과를 내는 능력이 핵심이다", "정의와 절제 없는 능력은 공동체를 해치므로 지혜와 덕이 먼저다"]
    counterexamples: []
    situations: ["성적 우수하고 인기 많지만 독선적인 학생회장 후보와 성실하지만 평범한 후보", "성과는 뛰어나나 윤리 논란이 있는 기업 대표"]
    abilities: [define, reason, counter]
    level_range: [2, 4]

  - id: ARC-J07
    question: "좋은 취지로 만든 제도가 악용되었을 때, 고쳐 쓸 것인가 없앨 것인가?"
    sources: [SRC-J007]
    conflicts: ["제도의 취지 vs 정략적 악용", "정적과의 연대 vs 정치적 원칙"]
    concepts: [제도 설계, 의도하지 않은 결과, 견제 장치]
    positions: ["악용이 드러난 제도는 신뢰를 잃었으므로 폐지해야 한다", "한 번의 악용보다 제도가 해 온 순기능이 크므로 보완해 유지해야 한다"]
    counterexamples: ["도편 추방이 70년간 견제 장치로 기능한 점"]
    situations: ["학급 투표제가 인기 투표로 변질되었을 때", "국민청원 제도가 특정 집단의 동원 수단이 될 때"]
    abilities: [understand, reason, respond, revise]
    level_range: [2, 4]

  - id: ARC-J08
    question: "압박에 몰린 약자가 약속을 깨고 살 길을 찾는 것은 배신인가, 현실적 선택인가?"
    sources: [SRC-J008]
    conflicts: ["생존 vs 신의", "정파 이익 vs 국익"]
    concepts: [동맹, 신의, 생존 전략, 내부 분열]
    positions: ["약속은 어려울 때 지켜야 의미가 있으며 깨면 결국 더 큰 대가를 치른다", "지켜 주지 못하는 상대와의 약속보다 구성원의 생존이 우선이다"]
    counterexamples: []
    situations: ["경영난 속에서 오랜 협력업체와의 계약을 깨고 더 큰 회사와 손잡을지 고민하는 기업", "팀 프로젝트 중 불리해지자 다른 팀으로 옮길지 고민하는 학생"]
    abilities: [understand, reason, counter]
    level_range: [1, 3]

  - id: ARC-J09
    question: "도움을 청한 상대를 의심하게 되었을 때, 자기 보호와 신뢰 중 무엇을 택해야 하는가?"
    sources: [SRC-J010]
    conflicts: ["자국 안전 vs 동맹의 신뢰", "의심 vs 예의"]
    concepts: [신뢰, 상호 존중, 안보 딜레마, 외교 관례]
    positions: ["위험 가능성이 있다면 관계를 해치더라도 자신을 먼저 지켜야 한다", "근거 없는 의심으로 신뢰를 깨면 더 큰 적대를 낳는다"]
    counterexamples: []
    situations: ["도움을 요청해 온 이웃 국가의 지원 인력을 보안을 이유로 거부할지", "도와주겠다고 온 친구가 내 비밀을 알게 될까 봐 돌려보낼지"]
    abilities: [understand, reason, respond]
    level_range: [1, 3]

topics:
  - id: TOP-J01
    archetypes: [ARC-J01]
    prompt: "학교에서 도난 사건이 일어났고, 대다수 학생이 한 학생을 범인으로 지목하며 즉시 징계하라고 요구한다. 학생부장은 당사자 소명과 조사를 거친 뒤 결정하겠다고 한다. 학생부장의 판단은 옳은가?"
    form: dilemma
    level: 2
    mode: B
    abilities: [understand, reason, counter]
    expected_turns: "6~8"
    rebuttal: low
    cross: false
    review: approved
  - id: TOP-J02
    archetypes: [ARC-J01]
    prompt: "대형 참사 직후 여론은 책임자를 빨리 처벌하라고 요구하지만, 법원은 개인별 책임을 따지느라 재판이 몇 년째 이어지고 있다. 이 경우 신속한 처벌을 위해 절차를 간소화하는 특별법을 만드는 것은 정당한가?"
    form: policy
    level: 4
    mode: B
    abilities: [reason, counter, rebut]
    expected_turns: "8~12"
    rebuttal: high
    cross: false
    review: approved
  - id: TOP-J03
    archetypes: [ARC-J02]
    prompt: "새로운 감염병이 급속히 퍼지고 있다. 정부는 확진자의 동선을 동의 없이 휴대전화 위치 정보로 추적해 공개하려 한다. 공동체의 안전을 위해 이런 조치를 어디까지 허용할 수 있는가?"
    form: policy
    level: 3
    mode: B
    abilities: [define, reason, counter]
    expected_turns: "8~10"
    rebuttal: mid
    cross: false
    review: approved
  - id: TOP-J04
    archetypes: [ARC-J02, ARC-J01]
    prompt: "‘결과적으로 공동체를 구했다면 절차를 어긴 지도자도 정당하다’는 주장과 ‘절차를 어긴 구원은 다음 독재의 선례가 된다’는 주장을 비교하고, 어느 쪽이 더 설득력 있는지 기준을 세워 판단하라."
    form: comparison
    level: 5
    mode: A
    abilities: [define, reason, rebut, revise]
    expected_turns: "10~14"
    rebuttal: high
    cross: true
    review: approved
  - id: TOP-J05
    archetypes: [ARC-J03]
    prompt: "축구 결승전에서 명백한 오심으로 패배가 확정될 상황이다. 주장인 당신은 판정에 항의하며 경기장을 떠날 수도, 판정을 받아들이고 끝까지 뛸 수도 있다. 어떻게 하겠는가?"
    form: dilemma
    level: 1
    mode: B
    abilities: [understand, respond, reason]
    expected_turns: "4~6"
    rebuttal: low
    cross: false
    review: approved
  - id: TOP-J06
    archetypes: [ARC-J03]
    prompt: "한 사회에서 혜택을 받으며 살아왔다면 그 사회의 부당한 결정에도 따라야 할 의무가 생기는가? ‘암묵적 동의’라는 개념이 이 의무를 정당화할 수 있는지 따져 보라."
    form: concept
    level: 4
    mode: A
    abilities: [define, reason, counter, rebut]
    expected_turns: "8~12"
    rebuttal: high
    cross: false
    review: approved
  - id: TOP-J07
    archetypes: [ARC-J04]
    prompt: "형이 무면허 운전으로 사고를 내고 달아났다는 사실을 당신만 알고 있다. 신고하면 형은 처벌받고, 신고하지 않으면 피해자는 보상을 받기 어렵다. 당신은 어떻게 하겠는가?"
    form: dilemma
    level: 2
    mode: B
    abilities: [understand, reason, respond]
    expected_turns: "6~8"
    rebuttal: mid
    cross: false
    review: approved
  - id: TOP-J08
    archetypes: [ARC-J04]
    prompt: "‘법보다 앞서는 인간의 도리가 있다’는 생각은 정의를 지키는 근거인가, 연고주의를 정당화하는 핑계인가? 두 가능성을 모두 검토하고 경계를 제시하라."
    form: concept
    level: 4
    mode: A
    abilities: [define, reason, counter, revise]
    expected_turns: "8~12"
    rebuttal: high
    cross: false
    review: approved
  - id: TOP-J09
    archetypes: [ARC-J05]
    prompt: "반 친구가 단체 대화방에서 따돌림을 당하고 있다. 끼어들면 나도 표적이 될 수 있다. 아무 말도 하지 않는 것은 중립인가, 가담인가?"
    form: dilemma
    level: 1
    mode: B
    abilities: [understand, reason, respond]
    expected_turns: "4~6"
    rebuttal: low
    cross: false
    review: approved
  - id: TOP-J10
    archetypes: [ARC-J05]
    prompt: "투표를 하지 않거나 사회 갈등에서 어느 편도 들지 않는 시민에게 불이익을 주는 제도(예: 의무 투표제)를 도입해야 하는가? 참여의 의무와 참여하지 않을 자유를 함께 고려해 판단하라."
    form: policy
    level: 3
    mode: B
    abilities: [reason, counter, rebut]
    expected_turns: "8~10"
    rebuttal: mid
    cross: false
    review: approved
  - id: TOP-J11
    archetypes: [ARC-J06]
    prompt: "학생회장 선거에 두 후보가 나왔다. A는 성적과 추진력이 뛰어나 공약 실현 가능성이 높지만 독선적이라는 평이 있고, B는 성과는 평범하지만 공정하고 절제력 있다는 평을 받는다. 누가 더 지도자에 적합한가?"
    form: comparison
    level: 2
    mode: B
    abilities: [define, reason, counter]
    expected_turns: "6~8"
    rebuttal: mid
    cross: false
    review: approved
  - id: TOP-J12
    archetypes: [ARC-J07]
    prompt: "학급에서 칭찬 스티커 제도를 도입했는데, 일부 학생들이 서로 몰아주기를 하며 제도를 악용하고 있다. 이 제도를 폐지할 것인가, 규칙을 고쳐 유지할 것인가?"
    form: policy
    level: 2
    mode: B
    abilities: [understand, reason, revise]
    expected_turns: "6~8"
    rebuttal: low
    cross: false
    review: approved
  - id: TOP-J13
    archetypes: [ARC-J08]
    prompt: "작은 가게가 오랫동안 거래해 온 납품업체와의 약속을 지키면 문을 닫을 위기다. 다른 업체로 바꾸면 살아남지만 신의를 저버리게 된다. 가게 주인은 어떻게 해야 하는가?"
    form: dilemma
    level: 3
    mode: B
    abilities: [reason, counter]
    expected_turns: "6~10"
    rebuttal: mid
    cross: false
    review: approved
  - id: TOP-J14
    archetypes: [ARC-J09, ARC-J08]
    prompt: "재난을 당한 나라가 이웃 나라에 구조대를 요청했다가, 구조대가 자국 내 정보를 수집할지 모른다는 우려가 제기되었다. 구조대를 받아들여야 하는가, 돌려보내야 하는가? 신뢰와 안전의 관점에서 판단하라."
    form: dilemma
    level: 3
    mode: C
    abilities: [understand, reason, respond]
    expected_turns: "6~10"
    rebuttal: mid
    cross: true
    review: approved
