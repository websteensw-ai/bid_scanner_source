    counter_claim: "다수 시민의 분명한 의사가 있다면 절차보다 신속한 책임 추궁이 민주적 정의에 더 부합한다."
    hidden_premise: "다수의 감정은 쉽게 조작될 수 있으므로 절차가 다수의 판단을 제어하는 장치여야 한다."
    counterexamples: ["절차가 지연을 위한 핑계로 악용되어 명백한 책임자가 처벌을 피하는 경우"]
    conflicts: ["민중의 분노 vs 적법 절차", "다수 의사 vs 개인의 권리"]
    universal_question: "다수가 분노로 한목소리를 낼 때, 절차를 고집하는 소수는 정의를 지키는 것인가 방해하는 것인가?"
    tags: [아르기누사이, 민회, 선동, 소크라테스, 펠로폰네소스전쟁]
    location: "PDF 36~38쪽 (관련 칼럼 ‘민주주의의 치명적 오류’ 26~28쪽)"
    summary: "아테네는 아르기누사이 해전에서 대승했지만 폭풍 탓에 난파 선원을 구하지 못했다. 선동가들은 유족처럼 꾸민 군중을 앞세워 분노를 키우고 장군들을 한꺼번에 사형 표결하자고 몰아붙였다. 협의회는 겁에 질려 이를 받아들였고 소크라테스만 개인별 심리를 규정한 법에 어긋난다며 반대했다. 결국 장군 6명이 처형되었고, 아테네인들은 곧 이를 깊이 후회했다."
