[project]
name = "essay-platform"
version = "0.1.0"
description = "웹 기반 논술 작성·제출·AI 첨삭 프로그램"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
# CSS·HTML 마크업 문자열은 줄 길이 제한에서 제외
"src/ui/theme.py" = ["E501"]
"views/*" = ["E501"]
