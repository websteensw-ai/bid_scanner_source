[project]
name = "essay-platform"
version = "0.1.0"
description = "논술 기초 다지기 — 학습 엔진과 웹앱"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
# CSS·HTML 마크업 문자열은 줄 길이 제한에서 제외
"src/ui/theme.py" = ["E501"]
"web/*" = ["E501"]
"evals/*" = ["E501"]

[tool.vercel]
# Vercel 이 FastAPI 앱을 찾는 위치
entrypoint = "web.main:app"
