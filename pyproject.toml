[project]
name = "essay-platform"
version = "0.1.0"
description = "논술 기초 다지기 — 학습 엔진과 웹앱"
requires-python = ">=3.11"
# Vercel 은 requirements.txt 보다 이 목록을 우선 설치한다. requirements.txt 와 같은 내용을 유지할 것
dependencies = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.55",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
# CSS·HTML 마크업 문자열은 줄 길이 제한에서 제외
"src/mvp/*" = ["E501"]   # 한국어 안내·발화 문자열
"tests/test_mvp.py" = ["E501"]
"tests/test_accounts.py" = ["E501"]
"web/*" = ["E501"]
"evals/*" = ["E501"]

[tool.vercel]
# Vercel 이 FastAPI 앱을 찾는 위치
entrypoint = "web.main:app"
