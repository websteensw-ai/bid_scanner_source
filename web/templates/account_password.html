{% extends "base.html" %}
{% block title %}비밀번호 변경 · 엘렝코스{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <div class="nx-label">비밀번호 변경</div>
  {% if forced %}<div class="alert info">처음 로그인했어요. 선생님이 알려 준 비밀번호를 나만 아는 비밀번호로 바꿔 주세요.</div>{% endif %}
  {% if error %}<div class="alert warn">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password" hx-boost="false" class="stack">
    <label class="field"><span>지금 비밀번호</span><input type="password" name="current" autocomplete="current-password" required></label>
    <label class="field"><span>새 비밀번호 (8자 이상)</span><input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
    <label class="field"><span>새 비밀번호 확인</span><input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary">바꾸기</button>
  </form>
</div>
{% endblock %}
