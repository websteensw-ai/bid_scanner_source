<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인 - 공공 입찰 매칭 서비스</title>
<style>
  body { font-family: "맑은 고딕", sans-serif; background: #f5f6fa; margin: 0; padding: 0; }
  .top-nav { max-width: 400px; margin: 0 auto; padding: 40px 24px 0; font-size: 13px; }
  .top-nav a { color: #1f4e78; }
  .wrap { max-width: 400px; margin: 16px auto 0; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; color: #1f2937; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; margin-top: 16px; }
  input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  button { margin-top: 28px; width: 100%; padding: 12px; background: #1f4e78; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #163a5a; }
  .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
  .info { color: #1f4e78; font-size: 13px; margin-top: 8px; }
  .alt { margin-top: 20px; font-size: 13px; text-align: center; }
  .alt a { color: #1f4e78; }
</style>
</head>
<body>
  <div class="top-nav"><a href="/">← 홈으로</a></div>
  <div class="wrap">
    <h1>로그인</h1>
    <div class="sub" style="font-size:13px;color:#6b7280;margin-bottom:20px;">이메일로 받는 인증코드로 로그인합니다. 비밀번호는 필요 없습니다.</div>
    <form method="post">
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required>
      <button type="submit">인증코드 받기</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% if info %}<div class="info">{{ info }}</div>{% endif %}
    </form>
    <div class="alt">계정이 없으신가요? <a href="/signup">회원가입</a></div>
    {% if test_login_enabled %}
    <div class="alt" style="margin-top:8px;"><a href="/test-login">로그인 없이 테스트 해보기 →</a></div>
    {% endif %}
  </div>
</body>
</html>
